<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b090c">
<title>Minhas Despesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b090c; --panel:#121013; --panel-2:#19151a; --line:#2c252d; --line-2:#3d343f;
  --text:#f3edf2; --muted:#9a8f99; --accent:#e3a9cf; --accent-2:#a8728f;
  --plum:#5b3a50; --green:#5fd38d; --green-bg:rgba(95,211,141,.10); --red:#ff7a8a; --red-bg:rgba(255,122,138,.10);
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:'Outfit',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1200px 700px at 70% -10%,#3a2433 0%,transparent 60%),
             radial-gradient(900px 600px at -10% 110%,#2a1a26 0%,transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}
.accent{color:var(--accent)}
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
}

/* Botões / pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid var(--line-2);transition:.2s;white-space:nowrap;font-size:.95rem}
.btn:hover{border-color:var(--accent-2);background:rgba(227,169,207,.06)}
.btn-primary{border:0;background:linear-gradient(135deg,#c98bb3,#8c5a7a);color:#fff;box-shadow:0 8px 30px -10px rgba(201,139,179,.6)}
.btn-primary:hover{filter:brightness(1.1);background:linear-gradient(135deg,#c98bb3,#8c5a7a)}
.btn-green{border:0;background:var(--green-bg);color:var(--green)}
.btn-green:hover{background:rgba(95,211,141,.18)}
.btn-danger{color:var(--red);border-color:rgba(255,122,138,.35)}
.btn-danger:hover{background:var(--red-bg);border-color:var(--red)}
.btn-block{width:100%}
.btn-sm{padding:6px 14px;font-size:.85rem}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.icon-btn:hover{border-color:var(--accent-2);color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 16px;border-radius:999px;border:1px solid var(--line-2);font-size:.85rem;transition:.2s}
.pill:hover{border-color:var(--accent-2)}
.pill.active{background:linear-gradient(90deg,#7a4d6a,#3d2836);border-color:transparent}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:16px}
.login-card{width:100%;max-width:400px;padding:36px 32px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.login-card::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;bottom:-220px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(227,169,207,.35),transparent 65%);pointer-events:none}
.login-card h1{font-weight:500;font-size:1.6rem;margin-top:10px}
.login-card .btn{margin-top:8px}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
input,select{background:#0e0c0f;border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;color:var(--text);outline:none;transition:.2s;width:100%}
input:focus,select:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(227,169,207,.12)}
input[type=date]{color-scheme:dark}
.error{color:var(--red);font-size:.85rem}

/* Layout */
.app{display:flex;gap:16px;padding:16px;min-height:100%;max-width:1400px;margin:0 auto}
.sidebar{width:240px;flex-shrink:0;background:#080708;border:1px solid var(--line);border-radius:var(--radius);padding:26px 16px;display:flex;flex-direction:column;gap:30px;position:sticky;top:16px;height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:500;padding:0 8px}
.brand-mark{color:var(--accent);font-size:1.4rem}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:16px;color:#d6ccd4;transition:.2s;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.04)}
.nav-item.active{background:linear-gradient(90deg,#7a4d6a,#2a1c26 90%);color:#fff}
.nav-item .count{margin-left:auto;font-size:.75rem;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:999px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;padding:12px 4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.welcome{font-weight:400;font-size:2rem}
.topbar-right{display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:linear-gradient(135deg,#e3a9cf,#6b3f5c);color:#fff}
.user-chip small{display:block;color:var(--muted);font-size:.78rem}

/* Cards */
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(3,1fr)}
.stat{padding:22px 24px;position:relative;overflow:hidden}
.stat .label{color:#d6ccd4;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.stat .value{font-size:2rem;font-weight:500;margin-top:14px;letter-spacing:.3px}
.stat .sub{font-size:.82rem;color:var(--muted);margin-top:6px}
.stat.glow{background:radial-gradient(400px 200px at 90% 0%,rgba(227,169,207,.22),transparent 70%),linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),var(--panel)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{font-weight:400;font-size:1.25rem}
.panel{padding:22px 24px}

/* Blocos */
.blocks{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.block{padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.2s;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.005)),#151216;border:1px solid var(--line);border-radius:20px;text-align:left;min-height:180px}
.block:hover{border-color:var(--accent-2);transform:translateY(-2px)}
.block-top{display:flex;justify-content:space-between;align-items:flex-start}
.block-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(227,169,207,.1);color:var(--accent)}
.block-name{font-size:1.1rem}
.block-amount{font-size:1.45rem;font-weight:500}
.block-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#8c5a7a,var(--green));border-radius:99px}
.block-new{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);background:transparent}
.block-new:hover{color:var(--accent)}
.block-new .plus{font-size:2rem;font-weight:300}

/* Lista de despesas */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:14px 12px;border-bottom:1px solid var(--line);border-radius:14px;transition:.2s}
.item:last-child{border-bottom:0}
.item:hover{background:rgba(255,255,255,.025)}
.item.paid{background:var(--green-bg);border-bottom-color:transparent;margin-bottom:6px}
.item.paid .item-amount{color:var(--green)}
.check{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:.2s}
.check:hover{border-color:var(--green);color:var(--green)}
.item.paid .check{background:var(--green);border-color:var(--green);color:#0b1a11}
.check svg{width:16px;height:16px;stroke-width:2.4}
.item-name{font-size:1rem}
.item-sub{font-size:.8rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item-amount{font-size:1.05rem;font-weight:500;text-align:right}
.tag{font-size:.72rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:#cfc3cc}
.tag.green{color:var(--green);border-color:rgba(95,211,141,.35);background:var(--green-bg)}
.tag.red{color:var(--red);border-color:rgba(255,122,138,.35);background:var(--red-bg)}
.item-actions{display:flex;gap:4px}
.item-actions .icon-btn{width:34px;height:34px;border-color:transparent}
.item-actions .icon-btn svg{width:17px;height:17px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.month-group{margin-top:10px}
.month-head{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;padding:10px 12px 6px}

/* Calendário */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-title{min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{text-align:center;font-size:.75rem;color:var(--muted);padding:2px 0 4px;text-transform:capitalize}
.cal-day{min-height:84px;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px;text-align:left;transition:.2s;background:rgba(255,255,255,.015);min-width:0}
.cal-day:hover{border-color:var(--accent-2);background:rgba(227,169,207,.05)}
.cal-day.out{opacity:.3}
.cal-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-day.over{background:var(--red-bg)}
.cal-day.done{background:var(--green-bg)}
.cal-day .n{font-size:.85rem}
.cal-day .amt{font-size:.72rem;color:#cfc3cc;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px}
.modal-card.wide{max-width:600px}
.modal-card .item{padding:12px 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0e0c0f;border:1px solid var(--line-2);border-radius:999px;padding:4px}
.seg button{padding:8px 6px;border-radius:999px;font-size:.88rem;color:var(--muted);transition:.2s}
.seg button.active{background:linear-gradient(90deg,#7a4d6a,#3d2836);color:#fff}
.hint{font-size:.8rem;color:var(--muted);background:rgba(227,169,207,.06);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:70;background:rgba(5,4,6,.55)}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fixas .item{grid-template-columns:auto 1fr auto auto}
.fx-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(227,169,207,.1);color:var(--accent)}
.fx-icon svg{width:16px;height:16px}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:6px}
.back:hover{color:var(--accent)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,4,6,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50}
.modal-card{width:100%;max-width:440px;padding:28px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.modal-card h3{font-weight:500;font-size:1.3rem}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.switch{display:flex;align-items:center;gap:10px;flex-direction:row;color:var(--text);cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--green)}
.icon-pick{display:flex;gap:8px;flex-wrap:wrap}
.icon-pick button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted)}
.icon-pick button.active{border-color:var(--accent);color:var(--accent);background:rgba(227,169,207,.1)}

.toast{position:fixed;bottom:24px;max-width:calc(100% - 32px);left:50%;transform:translateX(-50%);background:#1d181e;border:1px solid var(--line-2);padding:12px 20px;border-radius:999px;z-index:60;font-size:.9rem}

/* Responsivo */
@media (max-width:1000px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}}
@media (max-width:760px){
  .app{flex-direction:column;padding:12px 16px 96px}
  .sidebar{position:fixed;bottom:12px;left:12px;right:12px;top:auto;height:auto;width:auto;flex-direction:row;padding:8px;z-index:40;gap:0;box-shadow:0 10px 40px rgba(0,0,0,.6)}
  .sidebar .brand{display:none}
  .nav{flex-direction:row;gap:4px}
  .nav-item{flex-direction:column;gap:4px;padding:8px 4px;font-size:.72rem;justify-content:center;align-items:center;text-align:center}
  .nav-item .count{display:none}
  .sidebar .logout{width:auto;padding:8px 12px}
  .main{padding:4px 0}
  .welcome{font-size:1.5rem}
  .topbar-right .btn{display:none}
  .user-chip>div{display:none}
  .stats{grid-template-columns:1fr}
  .stat .value{font-size:1.6rem}
  .item{grid-template-columns:auto 1fr auto;padding:12px 6px;gap:10px}
  .item-actions{grid-column:2/-1;justify-content:flex-end;margin-top:-6px}
  .row{grid-template-columns:1fr}
  .cal{gap:4px}
  .cal-day{min-height:54px;padding:6px 5px;border-radius:10px}
  .cal-day .amt{display:none}
  .dot{width:6px;height:6px}
  .panel{padding:18px 14px}
  .fab{display:flex!important}
  .toast{bottom:100px}
}
.fab{display:none;position:fixed;right:20px;bottom:96px;width:56px;height:56px;border-radius:50%;z-index:41;align-items:center;justify-content:center;font-size:1.8rem;padding:0}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="login" class="login hidden">
  <form id="loginForm" class="login-card glass">
    <div class="brand" style="padding:0"><span class="brand-mark">◐</span> Minhas Despesas</div>
    <h1>Bem-vindo de volta</h1>
    <p class="muted">Entre para organizar suas contas</p>
    <label>Usuário<input id="loginUser" autocomplete="username" autocapitalize="none" required></label>
    <label>Senha<input id="loginPass" type="password" autocomplete="current-password" required></label>
    <p id="loginError" class="error hidden">Usuário ou senha inválidos</p>
    <button class="btn btn-primary btn-block" type="submit">Entrar</button>
  </form>
</section>

<!-- APP -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">◐</span> Despesas</div>
    <nav class="nav">
      <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/></svg><span>Início</span></button>
      <button class="nav-item" data-view="debts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Dívidas</span><span class="count" id="countDebts"></span></button>
      <button class="nav-item" data-view="paid"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>Pagas</span><span class="count" id="countPaid"></span></button>
    </nav>
    <button class="nav-item logout" id="logoutBtn"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Sair</span></button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h1 class="welcome">Bem-vindo, <span class="accent" id="userName"></span></h1>
        <p class="muted">Aqui está o resumo das suas despesas</p>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" data-action="new-expense">+ Nova despesa</button>
        <div class="user-chip"><div class="avatar" id="avatar"></div><div><span id="userName2"></span><small id="todayLabel"></small></div></div>
      </div>
    </header>
    <div id="view"></div>
  </main>
  <button class="btn btn-primary fab" data-action="new-expense" aria-label="Nova despesa">+</button>
</div>

<div id="modal" class="modal hidden"><div class="modal-card glass" id="modalCard"></div></div>
<div id="toast" class="toast hidden"></div>

<div id="loading" class="loading hidden"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>

  const [y, m, d] = s.split('-').map(Number);
  const first = new Date(y, m - 1 + k, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return iso(new Date(first.getFullYear(), first.getMonth(), Math.min(day || d, last)));
}
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const cents = v => Math.round(Number(v) * 100);
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ---------- Estado ----------
let me = null;           // { id, nome }
let membros = {};        // user_id -> nome
let data = { blocos: [], fixas: [], despesas: [] };
let route = { view: 'dashboard', blockId: null, filter: 'all' };
let calMonth = monthStart(todayISO());

const blockById = id => data.blocos.find(b => b.id === id);
const fixaById = id => data.fixas.find(f => f.id === id);
const despById = id => data.despesas.find(e => e.id === id);
const expensesOf = id => data.despesas.filter(e => e.bloco_id === id);
const isOverdue = e => !e.pago && e.vencimento < todayISO();
const sum = arr => arr.reduce((t, e) => t + Number(e.valor || 0), 0);
const byDue = (a, b) => a.vencimento.localeCompare(b.vencimento) || (a.parcela_num || 0) - (b.parcela_num || 0);

// ---------- Acesso ao banco ----------
let busy = 0;
function loading(on) { busy += on ? 1 : -1; $('#loading').classList.toggle('hidden', busy <= 0); }
async function db(promise) {
  const { data: d, error } = await promise;
  if (error) throw error;
  return d;
}
// executa uma alteração, recarrega tudo e redesenha a tela
async function mutate(fn, okMsg) {
  loading(true);
  try { await fn(); await refresh(); closeModal(); render(); if (okMsg) toast(okMsg); }
  catch (err) { console.error(err); toast('Erro: ' + (err.message || 'não foi possível salvar')); }
  finally { loading(false); }
}
async function refresh() {
  await db(sb.rpc('desp_gerar_fixas'));
  const [blocos, fixas, despesas] = await Promise.all([
    db(sb.from('desp_blocos').select('*').order('criado_em')),
    db(sb.from('desp_fixas').select('*').order('nome')),
    db(sb.from('desp_despesas').select('*').order('vencimento'))
  ]);
  data = { blocos, fixas, despesas };
}

// ---------- Login ----------
function showLogin() {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#loginUser').focus();
}
async function startApp(user) {
  loading(true);
  try {
    const lista = await db(sb.from('desp_membros').select('user_id, nome'));
    membros = Object.fromEntries(lista.map(m => [m.user_id, m.nome]));
    if (!membros[user.id]) { await sb.auth.signOut(); showLogin(); toast('Usuário sem acesso a este app'); return; }
    me = { id: user.id, nome: membros[user.id] };
    await refresh();
  } catch (err) { console.error(err); toast('Erro ao carregar: ' + err.message); showLogin(); return; }
  finally { loading(false); }
  $('#userName').textContent = me.nome;
  $('#userName2').textContent = me.nome;
  $('#avatar').textContent = me.nome[0];
  $('#todayLabel').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  go('dashboard');
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const u = $('#loginUser').value.trim().toLowerCase();
  const btn = $('#loginForm button'); btn.disabled = true;
  loading(true);
  const { data: res, error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + EMAIL_DOMAIN, password: $('#loginPass').value });
  loading(false); btn.disabled = false;
  if (error) { $('#loginError').classList.remove('hidden'); return; }
  $('#loginError').classList.add('hidden'); $('#loginPass').value = '';
  startApp(res.user);
});
$('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); me = null; showLogin(); });

// atualiza ao voltar para o app (ex.: a outra pessoa lançou algo)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !me || !$('#modal').classList.contains('hidden')) return;
  try { await refresh(); render(); } catch {}
});

// ---------- Navegação ----------
document.querySelectorAll('.nav-item[data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
document.querySelectorAll('[data-action="new-expense"]').forEach(b => b.addEventListener('click', () => expenseModal(null, { blockId: route.view === 'block' ? route.blockId : null })));

function go(view, blockId = null) {
  route = { view, blockId, filter: 'all' };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  document.querySelectorAll('.nav-item[data-view]').forEach(b =>
    b.classList.toggle('active', b.dataset.view === route.view || (route.view === 'block' && b.dataset.view === 'dashboard')));
  $('#countDebts').textContent = data.despesas.filter(e => !e.pago).length || '';
  $('#countPaid').textContent = data.despesas.filter(e => e.pago).length || '';

  if (route.view === 'block' && !blockById(route.blockId)) route.view = 'dashboard';
  if (route.view === 'dashboard') v.innerHTML = viewDashboard();
  else if (route.view === 'block') v.innerHTML = viewBlock();

// ---------- Views ----------
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

function viewDashboard() {
  const pend = data.despesas.filter(e => !e.pago);
  const over = pend.filter(isOverdue);
  const month = todayISO().slice(0, 7);
  const paidMonth = data.despesas.filter(e => e.pago && (e.data_pagamento || '').startsWith(month));

  const blocks = data.blocos.map(b => {
    const ex = expensesOf(b.id);
    const total = sum(ex), pago = sum(ex.filter(e => e.pago));
    const pct = total ? Math.round(pago / total * 100) : 0;
    const nPend = ex.filter(e => !e.pago).length;
    return `<div class="block" data-open-block="${b.id}" role="button" tabindex="0">
      <div class="block-top">
        <div class="block-icon">${SVG(ICONS[b.icone] || ICONS.wallet)}</div>
        <button class="icon-btn" data-edit-block="${b.id}" aria-label="Editar bloco" style="width:34px;height:34px">${SVG(I.dots)}</button>
      </div>
      <div><div class="block-name">${esc(b.nome)}</div><div class="muted" style="font-size:.8rem">Em aberto</div></div>
      <div class="block-amount">${brl(total - pago)}</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="block-meta"><span>${plural(nPend, 'pendente', 'pendentes')}</span><span>${pct}% pago</span></div>
    </div>`;
  }).join('');

  return `
  <div class="grid stats">
    <div class="glass stat glow"><div class="label">Total em aberto</div><div class="value">${brl(sum(pend))}</div><div class="sub">${plural(pend.length, 'dívida pendente', 'dívidas pendentes')}</div></div>
    <div class="glass stat"><div class="label">Pago este mês</div><div class="value" style="color:var(--green)">${brl(sum(paidMonth))}</div><div class="sub">${plural(paidMonth.length, 'pagamento', 'pagamentos')}</div></div>
    <div class="glass stat"><div class="label">Vencidas</div><div class="value" style="color:${over.length ? 'var(--red)' : 'var(--text)'}">${brl(sum(over))}</div><div class="sub">${over.length} em atraso</div></div>
  </div>

  <section class="glass panel" style="margin-top:16px">
    <div class="section-head"><h2>Meus blocos</h2><button class="btn btn-sm" data-new-block>+ Novo bloco</button></div>
    <div class="grid blocks">
      ${blocks}
      <button class="block block-new" data-new-block><span class="plus">+</span><span>Criar bloco</span></button>
    </div>
  </section>

  <section class="glass panel" style="margin-top:16px">${calendar()}</section>`;
}

function calendar() {
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(y, m - 1, 1 - first.getDay());   // domingo antes do dia 1
  const title = cap(first.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
  const today = todayISO();
  const byDay = {};
  data.despesas.forEach(e => (byDay[e.vencimento] = byDay[e.vencimento] || []).push(e));
  const monthItems = data.despesas.filter(e => e.vencimento.startsWith(calMonth.slice(0, 7)));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    const key = iso(d), items = byDay[key] || [];
    const pend = items.filter(e => !e.pago);
    const cls = ['cal-day', d.getMonth() !== m - 1 && 'out', key === today && 'today',
      pend.some(isOverdue) && 'over', items.length && !pend.length && 'done'].filter(Boolean).join(' ');
    const dots = items.slice(0, 6).map(e => `<i class="dot ${e.pago ? 'g' : isOverdue(e) ? 'r' : ''}"></i>`).join('');
    cells.push(`<button class="${cls}" data-day="${key}" aria-label="${fmtDate(key)}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span>${items.length ? `<span class="amt">${brl(sum(items))}</span>` : ''}</button>`);
  }
  const dows = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  return `
    <div class="section-head"><h2>Calendário</h2>
      <div class="cal-nav">
        <button class="icon-btn" data-cal="-1" aria-label="Mês anterior">${SVG(I.back)}</button>
        <span class="cal-title">${title}</span>
        <button class="icon-btn" data-cal="1" aria-label="Próximo mês">${SVG(I.next)}</button>
        <button class="btn btn-sm" data-cal="0">Hoje</button>
      </div>
    </div>
    <p class="muted" style="margin:-8px 0 12px">No mês: ${brl(sum(monthItems))} · pago ${brl(sum(monthItems.filter(e => e.pago)))}</p>
    <div class="cal">${dows}${cells.join('')}</div>
    <div class="legend"><span><i class="dot"></i> A pagar</span><span><i class="dot g"></i> Pago</span><span><i class="dot r"></i> Vencido</span></div>`;
}

function filterPills() {
  const f = route.filter;
  return `<div class="pills">
    <button class="pill ${f === 'all' ? 'active' : ''}" data-filter="all">Todas</button>
    <button class="pill ${f === 'open' ? 'active' : ''}" data-filter="open">Pendentes</button>
    <button class="pill ${f === 'paid' ? 'active' : ''}" data-filter="paid">Pagas</button>
  </div>`;
}

function viewBlock() {
  const b = blockById(route.blockId);
  const all = expensesOf(b.id);
  let ex = all;
  const open = sum(all.filter(e => !e.pago)), paid = sum(all.filter(e => e.pago));
  if (route.filter === 'open') ex = ex.filter(e => !e.pago);
  if (route.filter === 'paid') ex = ex.filter(e => e.pago);
  ex = [...ex].sort((a, c) => (a.pago - c.pago) || byDue(a, c));
  const fixas = data.fixas.filter(f => f.bloco_id === b.id);
  return `
  <button class="back" data-go="dashboard">${SVG(I.back)} Voltar aos blocos</button>
  <div class="grid stats">
    <div class="glass stat glow"><div class="label"><span style="display:flex;gap:10px;align-items:center">${SVG(ICONS[b.icone] || ICONS.wallet)} ${esc(b.nome)}</span>
      <button class="icon-btn" data-edit-block="${b.id}" aria-label="Editar bloco">${SVG(I.edit)}</button></div>
      <div class="value">${brl(open)}</div><div class="sub">em aberto</div></div>
    <div class="glass stat"><div class="label">Já pago</div><div class="value" style="color:var(--green)">${brl(paid)}</div><div class="sub">${plural(all.filter(e => e.pago).length, 'paga', 'pagas')}</div></div>
    <div class="glass stat"><div class="label">Total do bloco</div><div class="value">${brl(open + paid)}</div><div class="sub">${plural(all.length, 'lançamento', 'lançamentos')}</div></div>
  </div>
  ${fixas.length ? `<section class="glass panel fixas" style="margin-top:16px">
    <div class="section-head"><h2>Contas fixas</h2><span class="muted">${brl(sum(fixas.filter(f => !f.fim)))} / mês</span></div>
    <div class="list">${fixas.map(f => `<div class="item">
      <span class="fx-icon">${SVG(I.repeat)}</span>
      <div><div class="item-name">${esc(f.nome)}</div><div class="item-sub"><span>Todo dia ${f.dia_venc}</span>${f.fim ? `<span class="tag">Encerrada</span>` : ''}</div></div>
      <div class="item-amount">${brl(f.valor)}</div>
      <div class="item-actions"><button class="icon-btn" data-edit-fixa="${f.id}" aria-label="Editar conta fixa">${SVG(I.edit)}</button></div>
    </div>`).join('')}</div>
  </section>` : ''}
  <section class="glass panel" style="margin-top:16px">
    <div class="section-head"><h2>Despesas</h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap">${filterPills()}<button class="btn btn-primary btn-sm" data-add-in="${b.id}">+ Lançar despesa</button></div>
    </div>
    ${list(ex, false)}
  </section>`;
}

function blockPills() {
  const bf = route.filter;
  return `<div class="pills"><button class="pill ${bf === 'all' ? 'active' : ''}" data-filter="all">Todos</button>${
    data.blocos.map(b => `<button class="pill ${bf === b.id ? 'active' : ''}" data-filter="${b.id}">${esc(b.nome)}</button>`).join('')}</div>`;
}

function viewDebts() {
  const allPend = data.despesas.filter(e => !e.pago);
  const over = allPend.filter(isOverdue);
  let ex = route.filter === 'all' ? allPend : allPend.filter(e => e.bloco_id === route.filter);
  ex = [...ex].sort(byDue);
  return `
  <div class="grid stats" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div class="glass stat glow"><div class="label">Todas as dívidas</div><div class="value">${brl(sum(allPend))}</div><div class="sub">${plural(allPend.length, 'pendente', 'pendentes')}</div></div>
    <div class="glass stat"><div class="label">Vencidas</div><div class="value" style="color:${over.length ? 'var(--red)' : 'var(--text)'}">${brl(sum(over))}</div><div class="sub">${over.length} em atraso</div></div>
  </div>
  <section class="glass panel" style="margin-top:16px">
    <div class="section-head"><h2>Dívidas pendentes</h2>${blockPills()}</div>
    ${route.filter !== 'all' ? `<p class="muted" style="margin:-6px 0 10px">Subtotal: ${brl(sum(ex))}</p>` : ''}
    ${list(ex, true)}
  </section>`;
}

function viewPaid() {
  const allPaid = data.despesas.filter(e => e.pago);
  let ex = route.filter === 'all' ? allPaid : allPaid.filter(e => e.bloco_id === route.filter);
  ex = [...ex].sort((a, b) => (b.data_pagamento || '').localeCompare(a.data_pagamento || ''));
  const groups = {};
  ex.forEach(e => { const k = (e.data_pagamento || '0000-00').slice(0, 7); (groups[k] = groups[k] || []).push(e); });
  const body = ex.length ? Object.keys(groups).map(k => {
    const [y, m] = k.split('-');
    const label = k === '0000-00' ? 'Sem data' : cap(new Date(+y, +m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
    return `<div class="month-group"><div class="month-head"><span>${label}</span><span style="color:var(--green)">${brl(sum(groups[k]))}</span></div>${list(groups[k], true, true)}</div>`;
  }).join('') : list([], true);
  const last = [...allPaid].sort((a, b) => (b.data_pagamento || '').localeCompare(a.data_pagamento || ''))[0];
  return `
  <div class="grid stats" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div class="glass stat glow"><div class="label">Total já pago</div><div class="value" style="color:var(--green)">${brl(sum(allPaid))}</div><div class="sub">${plural(allPaid.length, 'pagamento', 'pagamentos')}</div></div>
    <div class="glass stat"><div class="label">Último pagamento</div><div class="value" style="font-size:1.5rem">${last ? esc(last.nome) : '—'}</div><div class="sub">${last ? fmtDate(last.data_pagamento) + ' · ' + brl(last.valor) : 'nenhum ainda'}</div></div>
  </div>
  <section class="glass panel" style="margin-top:16px">
    <div class="section-head"><h2>Histórico de pagamentos</h2>${blockPills()}</div>
    ${body}
  </section>`;
}

function typeTag(e) {
  if (e.tipo === 'parcelada') return `<span class="tag">Parcela ${e.parcela_num}/${e.parcela_total}</span>`;
  if (e.tipo === 'fixa') return `<span class="tag">Fixa</span>`;
  return '';
}

function list(items, showBlock, inner = false) {
  if (!items.length) return inner ? '' : `<div class="empty">Nada por aqui ainda ✨</div>`;
  return `<div class="list">${items.map(e => {
    const b = blockById(e.bloco_id);
    const status = e.pago ? `<span class="tag green">Pago em ${fmtDate(e.data_pagamento)}</span>`
      : isOverdue(e) ? `<span class="tag red">Vencida</span>` : '';
    const who = membros[e.criado_por];
    return `<div class="item ${e.pago ? 'paid' : ''}">
      <button class="check" data-toggle="${e.id}" aria-label="${e.pago ? 'Desmarcar pago' : 'Marcar como pago'}">${e.pago ? SVG(I.check) : ''}</button>
      <div>
        <div class="item-name">${esc(e.nome)}</div>
        <div class="item-sub">${showBlock && b ? `<span class="tag">${esc(b.nome)}</span>` : ''}${typeTag(e)}<span>Vence ${fmtDate(e.vencimento)}</span>${status}${who && who !== me.nome ? `<span>· por ${esc(who)}</span>` : ''}</div>
      </div>
      <div class="item-amount">${brl(e.valor)}</div>
      <div class="item-actions">
        ${e.pago ? '' : `<button class="btn btn-green btn-sm" data-pay="${e.id}">Já paguei</button>`}
        <button class="icon-btn" data-edit="${e.id}" aria-label="Editar">${SVG(I.edit)}</button>
        <button class="icon-btn" data-del="${e.id}" aria-label="Excluir">${SVG(I.trash)}</button>
      </div>
    </div>`;
  }).join('')}</div>`;
}

// ---------- Eventos ----------
function bindView(root) {
  const on = (sel, fn) => root.querySelectorAll(sel).forEach(el => el.addEventListener('click', ev => fn(el, ev)));
  root.querySelectorAll('[data-open-block]').forEach(el => {
    el.addEventListener('click', () => go('block', el.dataset.openBlock));
    el.addEventListener('keydown', e => { if (e.key === 'Enter') go('block', el.dataset.openBlock); });
  });
  on('[data-edit-block]', (el, ev) => { ev.stopPropagation(); blockModal(el.dataset.editBlock); });
  on('[data-new-block]', () => blockModal(null));
  on('[data-go]', el => go(el.dataset.go));
  on('[data-filter]', el => { route.filter = el.dataset.filter; render(); });
  on('[data-add-in]', el => expenseModal(null, { blockId: el.dataset.addIn }));
  on('[data-pay]', el => payModal(el.dataset.pay));
  on('[data-toggle]', el => {
    const e = despById(el.dataset.toggle);
    if (e.pago) mutate(() => db(sb.from('desp_despesas').update({ pago: false, data_pagamento: null }).eq('id', e.id)), 'Marcada como pendente');
    else payModal(e.id);
  });
  on('[data-edit]', el => expenseModal(el.dataset.edit));
  on('[data-edit-fixa]', el => fixaModal(el.dataset.editFixa));
  on('[data-del]', el => deleteModal(el.dataset.del));
  on('[data-cal]', el => {
    const k = +el.dataset.cal;
    calMonth = k ? addMonths(calMonth, k, 1) : monthStart(todayISO());
    render();
  });
  on('[data-day]', el => dayModal(el.dataset.day));
}

// ---------- Modais ----------
function openModal(html, wide = false) {
  $('#modalCard').className = 'modal-card glass' + (wide ? ' wide' : '');
  $('#modalCard').innerHTML = html; $('#modal').classList.remove('hidden');
  const f = $('#modalCard input:not([type=checkbox])'); if (f && !wide) setTimeout(() => f.focus(), 50);
}
function closeModal() { $('#modal').classList.add('hidden'); $('#modalCard').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
const bindClose = () => $('#modalCard').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));

function dayModal(day) {
  const items = data.despesas.filter(e => e.vencimento === day).sort((a, b) => (a.pago - b.pago) || a.nome.localeCompare(b.nome));
  const label = cap(new Date(day + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }));
  openModal(`
    <h3>${label}</h3>
    ${items.length ? `<p class="muted">Total ${brl(sum(items))} · pago ${brl(sum(items.filter(e => e.pago)))} · a pagar ${brl(sum(items.filter(e => !e.pago)))}</p>` : ''}
    ${items.length ? list(items, true) : '<div class="empty" style="padding:24px">Nenhuma conta vence neste dia</div>'}
    <div class="modal-actions">
      <button class="btn" data-close>Fechar</button>
      <button class="btn btn-primary" id="dayAdd">+ Lançar neste dia</button>
    </div>`, true);
  bindClose();
  bindView($('#modalCard'));
  $('#dayAdd').addEventListener('click', () => expenseModal(null, { due: day }));
}

function blockModal(id) {
  const b = id ? blockById(id) : { nome: '', icone: 'wallet' };
  let icon = b.icone;
  openModal(`
    <h3>${id ? 'Editar bloco' : 'Novo bloco'}</h3>
    <form id="blockForm" style="display:flex;flex-direction:column;gap:14px">
      <label>Nome do bloco<input id="bName" value="${esc(b.nome)}" placeholder="Ex.: Cartão Nubank" required maxlength="40"></label>
      <label>Ícone</label>
      <div class="icon-pick" id="iconPick">${Object.keys(ICONS).map(k => `<button type="button" data-icon="${k}" class="${k === icon ? 'active' : ''}">${SVG(ICONS[k])}</button>`).join('')}</div>
      <div class="modal-actions">
        ${id ? `<button type="button" class="btn btn-danger" id="bDel" style="margin-right:auto">Excluir</button>` : ''}
        <button type="button" class="btn" data-close>Cancelar</button>
        <button class="btn btn-primary">Salvar</button>
      </div>
    </form>`);
  bindClose();
  $('#iconPick').querySelectorAll('button').forEach(bt => bt.addEventListener('click', () => {
    icon = bt.dataset.icon; $('#iconPick').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === bt));
  }));
  $('#blockForm').addEventListener('submit', e => {
    e.preventDefault();
    const nome = $('#bName').value.trim(); if (!nome) return;
    mutate(() => id ? db(sb.from('desp_blocos').update({ nome, icone: icon }).eq('id', id))
                    : db(sb.from('desp_blocos').insert({ nome, icone: icon })), id ? 'Bloco atualizado' : 'Bloco criado');
  });
  if (id) $('#bDel').addEventListener('click', () => {
    const n = expensesOf(id).length + data.fixas.filter(f => f.bloco_id === id).length;
    confirmModal(`Excluir o bloco "${esc(b.nome)}"?`, n ? 'Todas as despesas e contas fixas dentro dele também serão excluídas.' : 'O bloco está vazio.', [
      { label: 'Excluir', run: () => mutate(() => db(sb.from('desp_blocos').delete().eq('id', id)), 'Bloco excluído') }
    ]);
  });
}

// Nova despesa: avulsa, fixa (todo mês) ou parcelada. Edição: altera só o lançamento escolhido.
function expenseModal(id, opts = {}) {
  if (!data.blocos.length) { toast('Crie um bloco primeiro'); blockModal(null); return; }
  const e = id ? despById(id) : {
    nome: '', valor: '', vencimento: opts.due || todayISO(), pago: false, data_pagamento: '',
    bloco_id: opts.blockId || data.blocos[0].id, tipo: 'avulsa'
  };
  let tipo = e.tipo;
  const blockSelect = `<label>Bloco<select id="eBlock">${data.blocos.map(b => `<option value="${b.id}" ${b.id === e.bloco_id ? 'selected' : ''}>${esc(b.nome)}</option>`).join('')}</select></label>`;
  openModal(`
    <h3>${id ? 'Editar despesa' : 'Nova despesa'}</h3>
    <form id="expForm" style="display:flex;flex-direction:column;gap:14px">
      ${id ? (e.tipo === 'parcelada' ? `<div class="hint">Parcela ${e.parcela_num} de ${e.parcela_total}</div>`
             : e.tipo === 'fixa' && fixaById(e.fixa_id) ? `<div class="hint">Lançamento de uma conta fixa. Para mudar todos os meses, <a href="#" id="goFixa" class="accent">edite a conta fixa</a>.</div>` : '')
           : `<div class="seg" id="tipoSeg">
                <button type="button" data-t="avulsa" class="active">Única</button>
                <button type="button" data-t="fixa">Fixa mensal</button>
                <button type="button" data-t="parcelada">Parcelada</button>
              </div>`}
      <label>Nome da dívida<input id="eName" value="${esc(e.nome)}" placeholder="Ex.: Conta de luz" required maxlength="60"></label>
      <div class="row">
        <label><span id="lblValor">Valor (R$)</span><input id="eAmount" type="number" inputmode="decimal" step="0.01" min="0" value="${e.valor}" placeholder="0,00" required></label>
        <label><span id="lblDue">Vencimento</span><input id="eDue" type="date" value="${e.vencimento}" required></label>
      </div>
      <div id="parcBox" class="hidden" style="display:flex;flex-direction:column;gap:14px">
        <div class="row">
          <label>Nº de parcelas<input id="eParc" type="number" min="2" max="120" step="1" value="2"></label>
          <label>O valor digitado é<select id="eModo"><option value="parcela">Valor de cada parcela</option><option value="total">Valor total</option></select></label>
        </div>
        <label>Parcelas já pagas<input id="eJaPagas" type="number" min="0" max="119" step="1" value="0"></label>
        <div class="hint" id="parcResumo"></div>
      </div>
      <div id="fixaBox" class="hint hidden">Vai ser lançada automaticamente todo mês no mesmo dia, a partir da data escolhida.</div>
      ${blockSelect}
      ${id && e.tipo === 'parcelada' ? `<label class="switch"><input type="checkbox" id="eAll"> Aplicar nome, valor e bloco às parcelas não pagas</label>` : ''}
      <div id="paidBox">
        <label class="switch"><input type="checkbox" id="ePaid" ${e.pago ? 'checked' : ''}> Já paguei</label>
        <label id="ePaidWrap" class="${e.pago ? '' : 'hidden'}" style="margin-top:12px">Data do pagamento<input id="ePaidDate" type="date" value="${e.data_pagamento || todayISO()}"></label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancelar</button>
        <button class="btn btn-primary">Salvar</button>
      </div>
    </form>`);
  bindClose();
  const goFixa = $('#goFixa'); if (goFixa) goFixa.addEventListener('click', ev => { ev.preventDefault(); fixaModal(e.fixa_id); });

  const resumo = () => {
    const n = Math.max(2, parseInt($('#eParc').value) || 2);
    const v = parseFloat($('#eAmount').value) || 0;
    const parcela = $('#eModo').value === 'total' ? v / n : v;
    const ult = addMonths($('#eDue').value || todayISO(), n - 1);
    $('#parcResumo').textContent = `${n}x de ${brl(parcela)} = ${brl(parcela * n)} · última em ${fmtDate(ult)}`;
  };
  const setTipo = t => {
    tipo = t;
    document.querySelectorAll('#tipoSeg button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    $('#parcBox').classList.toggle('hidden', !!id || t !== 'parcelada');
    $('#fixaBox').classList.toggle('hidden', !!id || t !== 'fixa');
    $('#paidBox').classList.toggle('hidden', t !== 'avulsa' && !id);
    $('#lblValor').textContent = t === 'fixa' && !id ? 'Valor mensal (R$)' : 'Valor (R$)';
    $('#lblDue').textContent = t === 'avulsa' || id ? 'Vencimento' : t === 'fixa' ? 'Primeiro vencimento' : '1ª parcela vence';
    if (t === 'parcelada' && !id) resumo();
  };
  document.querySelectorAll('#tipoSeg button').forEach(b => b.addEventListener('click', () => setTipo(b.dataset.t)));
  ['#eParc', '#eModo', '#eAmount', '#eDue'].forEach(s => $(s).addEventListener('input', () => tipo === 'parcelada' && !id && resumo()));
  $('#ePaid').addEventListener('change', ev => $('#ePaidWrap').classList.toggle('hidden', !ev.target.checked));
  setTipo(tipo);

  $('#expForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const nome = $('#eName').value.trim();
    const valor = Math.round((parseFloat($('#eAmount').value) || 0) * 100) / 100;
    const due = $('#eDue').value, bloco_id = $('#eBlock').value;
    const pago = $('#ePaid').checked, data_pagamento = pago ? ($('#ePaidDate').value || todayISO()) : null;

    if (id) {
      const applyAll = $('#eAll') && $('#eAll').checked;
      return mutate(async () => {
        await db(sb.from('desp_despesas').update({ nome, valor, vencimento: due, bloco_id, pago, data_pagamento }).eq('id', id));
        if (applyAll) await db(sb.from('desp_despesas').update({ nome, valor, bloco_id }).eq('grupo_id', e.grupo_id).eq('pago', false));
      }, 'Despesa atualizada');
    }
    if (tipo === 'avulsa') {
      return mutate(() => db(sb.from('desp_despesas').insert({ nome, valor, vencimento: due, bloco_id, pago, data_pagamento, tipo })), 'Despesa lançada');
    }
    if (tipo === 'fixa') {
      return mutate(() => db(sb.from('desp_fixas').insert({ nome, valor, bloco_id, dia_venc: +due.slice(8, 10), inicio: monthStart(due) })), 'Conta fixa criada');
    }
    // parcelada: divide o total em centavos (a diferença do arredondamento vai na 1ª parcela)
    const n = Math.min(120, Math.max(2, parseInt($('#eParc').value) || 2));
    const jaPagas = Math.min(n, Math.max(0, parseInt($('#eJaPagas').value) || 0));
    const total = $('#eModo').value === 'total' ? cents(valor) : cents(valor) * n;
    const base = Math.floor(total / n), resto = total - base * n;
    const grupo_id = crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ Math.random() * 16 >> c / 4).toString(16));
    const day = +due.slice(8, 10);
    const rows = Array.from({ length: n }, (_, i) => {
      const venc = addMonths(due, i, day);
      return { nome, bloco_id, tipo, grupo_id, parcela_num: i + 1, parcela_total: n,
        valor: (base + (i === 0 ? resto : 0)) / 100, vencimento: venc,
        pago: i < jaPagas, data_pagamento: i < jaPagas ? (venc < todayISO() ? venc : todayISO()) : null };
    });
    mutate(() => db(sb.from('desp_despesas').insert(rows)), `${n} parcelas lançadas`);
  });
}

function fixaModal(fid) {
  const f = fixaById(fid);
  const mesAtual = monthStart(todayISO());
  openModal(`
    <h3>Conta fixa</h3>
    <p class="muted">As mudanças valem para os lançamentos ainda não pagos deste mês em diante.</p>
    <form id="fixaForm" style="display:flex;flex-direction:column;gap:14px">
      <label>Nome<input id="fName" value="${esc(f.nome)}" required maxlength="60"></label>
      <div class="row">
        <label>Valor mensal (R$)<input id="fValor" type="number" step="0.01" min="0" value="${f.valor}" required></label>
        <label>Dia do vencimento<input id="fDia" type="number" min="1" max="31" value="${f.dia_venc}" required></label>
      </div>
      <label>Bloco<select id="fBlock">${data.blocos.map(b => `<option value="${b.id}" ${b.id === f.bloco_id ? 'selected' : ''}>${esc(b.nome)}</option>`).join('')}</select></label>
      ${f.fim ? `<div class="hint">Encerrada: último mês ${fmtDate(f.fim).slice(3)}</div>` : ''}
      <div class="modal-actions">
        ${f.fim ? `<button type="button" class="btn" id="fReativar" style="margin-right:auto">Reativar</button>`
                : `<button type="button" class="btn btn-danger" id="fEncerrar" style="margin-right:auto">Encerrar</button>`}
        <button type="button" class="btn" data-close>Cancelar</button>
        <button class="btn btn-primary">Salvar</button>
      </div>
    </form>`);
  bindClose();
  $('#fixaForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const nome = $('#fName').value.trim(), valor = Math.round(parseFloat($('#fValor').value) * 100) / 100 || 0;
    const dia_venc = Math.min(31, Math.max(1, parseInt($('#fDia').value) || 1)), bloco_id = $('#fBlock').value;
    mutate(async () => {
      await db(sb.from('desp_fixas').update({ nome, valor, dia_venc, bloco_id }).eq('id', fid));
      const futuros = data.despesas.filter(e => e.fixa_id === fid && !e.pago && e.mes_ref >= mesAtual);
      await Promise.all(futuros.map(e => db(sb.from('desp_despesas')
        .update({ nome, valor, bloco_id, vencimento: addMonths(e.mes_ref, 0, dia_venc) }).eq('id', e.id))));
    }, 'Conta fixa atualizada');
  });
  const enc = $('#fEncerrar');
  if (enc) enc.addEventListener('click', () => confirmModal(`Encerrar "${esc(f.nome)}"?`,
    'Ela para de ser lançada nos próximos meses. O que já foi lançado continua no histórico.', [
      { label: 'Encerrar', run: () => mutate(() => db(sb.from('desp_fixas').update({ fim: mesAtual }).eq('id', fid)), 'Conta fixa encerrada') },
      { label: 'Excluir de vez', run: () => mutate(async () => {
          await db(sb.from('desp_despesas').delete().eq('fixa_id', fid).eq('pago', false));
          await db(sb.from('desp_fixas').delete().eq('id', fid));
        }, 'Conta fixa excluída') }
    ]));
  const re = $('#fReativar');
  if (re) re.addEventListener('click', () => mutate(() => db(sb.from('desp_fixas').update({ fim: null }).eq('id', fid)), 'Conta fixa reativada'));
}

function payModal(id) {
  const e = despById(id);
  openModal(`
    <h3>Marcar como pago</h3>
    <p class="muted">${esc(e.nome)} ${e.tipo === 'parcelada' ? `(${e.parcela_num}/${e.parcela_total})` : ''} · ${brl(e.valor)}</p>
    <form id="payForm" style="display:flex;flex-direction:column;gap:14px">
      <label>Data do pagamento<input id="pDate" type="date" value="${todayISO()}" required></label>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancelar</button>
        <button class="btn btn-green">${SVG(I.check)} Já paguei</button>
      </div>
    </form>`);
  bindClose();
  $('#payForm').addEventListener('submit', ev => {
    ev.preventDefault();
    mutate(() => db(sb.from('desp_despesas').update({ pago: true, data_pagamento: $('#pDate').value || todayISO() }).eq('id', id)), 'Pagamento registrado ✓');
  });
}

function deleteModal(id) {
  const e = despById(id);
  const del = (q, msg) => ({ label: msg, run: () => mutate(() => db(q), 'Excluído') });
  const T = sb.from.bind(sb);
  let opts;
  if (e.tipo === 'parcelada') opts = [
    del(T('desp_despesas').delete().eq('id', id), 'Só esta parcela'),
    del(T('desp_despesas').delete().eq('grupo_id', e.grupo_id).eq('pago', false), 'Todas as não pagas'),
    del(T('desp_despesas').delete().eq('grupo_id', e.grupo_id), 'Todas as parcelas')
  ];
  else if (e.tipo === 'fixa' && fixaById(e.fixa_id) && !fixaById(e.fixa_id).fim) opts = [
    del(T('desp_despesas').delete().eq('id', id), 'Só este mês'),
    { label: 'Este mês e encerrar a conta fixa', run: () => mutate(async () => {
        await db(sb.from('desp_despesas').delete().eq('id', id));
        await db(sb.from('desp_fixas').update({ fim: addMonths(e.mes_ref, -1, 1) }).eq('id', e.fixa_id));
      }, 'Conta fixa encerrada') }
  ];
  else opts = [del(T('desp_despesas').delete().eq('id', id), 'Excluir')];
  confirmModal(`Excluir "${esc(e.nome)}"?`, 'Essa ação não pode ser desfeita.', opts);
}

function confirmModal(title, text, actions) {
  openModal(`<h3>${title}</h3><p class="muted">${text}</p>
    <div class="modal-actions">${actions.map((a, i) => `<button class="btn btn-danger" data-act="${i}">${a.label}</button>`).join('')}<button class="btn" data-close>Cancelar</button></div>`);
  bindClose();
  $('#modalCard').querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => actions[+b.dataset.act].run()));
}

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 2600);
}

// ---------- Início ----------
sb.auth.getSession().then(({ data: { session } }) => session ? startApp(session.user) : showLogin());
</script>
</body>
