<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0d08">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Despesas">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23e6ff8a'/%3E%3Cstop offset='1' stop-color='%237bd11f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='18' fill='%2310170b'/%3E%3Crect x='.5' y='.5' width='63' height='63' rx='17.5' fill='none' stroke='%23c6ff3d' stroke-opacity='.25'/%3E%3Cpath d='M19 15h12.5a17 17 0 0 1 0 34H19z' fill='none' stroke='url(%23g)' stroke-width='6' stroke-linejoin='round'/%3E%3Cpath d='m25.5 32.5 5 5 9-10.5' fill='none' stroke='url(%23g)' stroke-width='5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Minhas Despesas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b090c; --panel:#121013; --panel-2:#19151a; --line:#2c252d; --line-2:#3d343f;
  --text:#f3edf2; --muted:#9a8f99; --accent:#c6ff3d; --accent-2:#78a828;
  --plum:#3f5c14; --green:#5fd38d; --green-bg:rgba(95,211,141,.10); --red:#ff7a8a; --red-bg:rgba(255,122,138,.10);
  --radius:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
html{-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{overflow-x:hidden}
body{
  font-family:'Outfit',system-ui,sans-serif;color:var(--text);
  background:radial-gradient(1200px 700px at 70% -10%,#1d2b0e 0%,transparent 60%),
             radial-gradient(900px 600px at -10% 110%,#142009 0%,transparent 60%),var(--bg);
  background-attachment:fixed;-webkit-font-smoothing:antialiased;
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
.hidden{display:none!important}
.muted{color:var(--muted);font-size:.9rem}
.accent{color:var(--accent)}
.glass{
  background:linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),var(--panel);
  border:1px solid var(--line);border-radius:var(--radius);
}

/* Botões / pills */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 20px;border-radius:999px;border:1px solid var(--line-2);transition:.2s;white-space:nowrap;font-size:.95rem}
.btn:hover{border-color:var(--accent-2);background:rgba(198,255,61,.06)}
.btn-primary{border:0;background:linear-gradient(135deg,#d4ff5c,#8fd12b);color:#0b1204;box-shadow:0 8px 30px -10px rgba(198,255,61,.6)}
.btn-primary:hover{filter:brightness(1.1);background:linear-gradient(135deg,#d4ff5c,#8fd12b)}
.btn-green{border:0;background:var(--green-bg);color:var(--green)}
.btn-green:hover{background:rgba(95,211,141,.18)}
.btn-danger{color:var(--red);border-color:rgba(255,122,138,.35)}
.btn-danger:hover{background:var(--red-bg);border-color:var(--red)}
.btn-block{width:100%}
.btn-sm{padding:6px 14px;font-size:.85rem}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line-2);display:inline-flex;align-items:center;justify-content:center;transition:.2s}
.icon-btn:hover{border-color:var(--accent-2);color:var(--accent)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 16px;border-radius:999px;border:1px solid var(--line-2);font-size:.85rem;transition:.2s}
.pill:hover{border-color:var(--accent-2)}
.pill.active{background:linear-gradient(90deg,#3f5c14,#1b2709);border-color:transparent}

/* Login */
.login{min-height:100%;display:grid;place-items:center;padding:calc(16px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.login-card{width:100%;max-width:400px;padding:36px 32px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.login-card::after{content:"";position:absolute;width:320px;height:320px;border-radius:50%;bottom:-220px;left:50%;transform:translateX(-50%);background:radial-gradient(circle,rgba(198,255,61,.35),transparent 65%);pointer-events:none}
.login-card h1{font-weight:500;font-size:1.6rem;margin-top:10px}
.login-card .btn{margin-top:8px}
label{display:flex;flex-direction:column;gap:6px;font-size:.85rem;color:var(--muted)}
input,select{background:#0e0c0f;border:1px solid var(--line-2);border-radius:14px;padding:12px 14px;color:var(--text);outline:none;transition:.2s;width:100%}
input:focus,select:focus{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(198,255,61,.12)}
input[type=date]{color-scheme:dark}
.error{color:var(--red);font-size:.85rem}

/* Layout */
.app{display:flex;gap:16px;padding:16px;min-height:100%;max-width:1400px;margin:0 auto}
.sidebar{width:240px;flex-shrink:0;background:#080708;border:1px solid var(--line);border-radius:var(--radius);padding:26px 16px;display:flex;flex-direction:column;gap:30px;position:sticky;top:16px;height:calc(100vh - 32px)}
.brand{display:flex;align-items:center;gap:10px;font-size:1.2rem;font-weight:500;padding:0 8px}
.brand .logo{width:36px;height:36px;stroke:none;filter:drop-shadow(0 4px 14px rgba(198,255,61,.25))}
svg.logo{fill:none;stroke:none}
.login-logo{display:flex;flex-direction:column;align-items:center;gap:12px;font-size:1.1rem;font-weight:500;margin-bottom:4px}
.login-logo .logo{width:76px;height:76px;filter:drop-shadow(0 10px 30px rgba(198,255,61,.3))}
.login-card h1{text-align:center}
.login-card>p.muted{text-align:center}
.m-logo{display:none}
.nav-add{display:none}
.nav{display:flex;flex-direction:column;gap:6px;flex:1}
.nav-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-radius:16px;color:#d6ccd4;transition:.2s;text-align:left;width:100%}
.nav-item:hover{background:rgba(255,255,255,.04)}
.nav-item.active{background:linear-gradient(90deg,#3f5c14,#121a07 90%);color:#fff}
.nav-item .count{margin-left:auto;font-size:.75rem;background:rgba(255,255,255,.08);padding:2px 8px;border-radius:999px}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:20px;padding:12px 4px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.welcome{font-weight:400;font-size:2rem}
.topbar-right{display:flex;align-items:center;gap:12px}
.user-chip{display:flex;align-items:center;gap:10px}
.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:600;background:linear-gradient(135deg,#d4ff5c,#5d8f1c);color:#0b1204}
.user-chip small{display:block;color:var(--muted);font-size:.78rem}

/* Cards */
.grid{display:grid;gap:16px}
.stats{grid-template-columns:repeat(3,1fr)}
.stat{padding:22px 24px;position:relative;overflow:hidden}
.stat .label{color:#d6ccd4;font-size:1rem;display:flex;justify-content:space-between;align-items:center}
.stat .value{font-size:2rem;font-weight:500;margin-top:14px;letter-spacing:.3px}
.stat .sub{font-size:.82rem;color:var(--muted);margin-top:6px}
.stat.glow{background:radial-gradient(400px 200px at 90% 0%,rgba(198,255,61,.22),transparent 70%),linear-gradient(160deg,rgba(255,255,255,.045),rgba(255,255,255,.01)),var(--panel)}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.section-head h2{font-weight:400;font-size:1.25rem}
.panel{padding:22px 24px}

/* Blocos */
.blocks{grid-template-columns:repeat(auto-fill,minmax(220px,1fr))}
.block{padding:20px;display:flex;flex-direction:column;gap:14px;cursor:pointer;transition:.2s;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.005)),#151216;border:1px solid var(--line);border-radius:20px;text-align:left;min-height:180px}
.block:hover{border-color:var(--accent-2);transform:translateY(-2px)}
.block-top{display:flex;justify-content:space-between;align-items:flex-start}
.block-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:rgba(198,255,61,.1);color:var(--accent)}
.block-name{font-size:1.1rem}
.block-amount{font-size:1.45rem;font-weight:500}
.block-meta{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.progress{height:6px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#5d8f1c,var(--green));border-radius:99px}
.block-new{border-style:dashed;align-items:center;justify-content:center;color:var(--muted);background:transparent}
.block-new:hover{color:var(--accent)}
.block-new .plus{font-size:2rem;font-weight:300}

/* Lista de despesas */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:14px;padding:14px 12px;border-bottom:1px solid var(--line);border-radius:14px;transition:.2s}
.item:last-child{border-bottom:0}
.item:hover{background:rgba(255,255,255,.025)}
.item.paid{background:var(--green-bg);border-bottom-color:transparent;margin-bottom:6px}
.item.paid .item-amount{color:var(--green)}
.check{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);display:grid;place-items:center;transition:.2s}
.check:hover{border-color:var(--green);color:var(--green)}
.item.paid .check{background:var(--green);border-color:var(--green);color:#0b1a11}
.check svg{width:16px;height:16px;stroke-width:2.4}
.item-name{font-size:1rem}
.item-sub{font-size:.8rem;color:var(--muted);margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.item-amount{font-size:1.05rem;font-weight:500;text-align:right}
.tag{font-size:.72rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line-2);color:#cfc3cc}
.tag.green{color:var(--green);border-color:rgba(95,211,141,.35);background:var(--green-bg)}
.tag.red{color:var(--red);border-color:rgba(255,122,138,.35);background:var(--red-bg)}
.item-actions{display:flex;gap:4px}
.item-actions .icon-btn{width:34px;height:34px;border-color:transparent}
.item-actions .icon-btn svg{width:17px;height:17px}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}
.month-group{margin-top:10px}
.month-head{display:flex;justify-content:space-between;color:var(--muted);font-size:.85rem;padding:10px 12px 6px}

/* Calendário */
.cal-nav{display:flex;align-items:center;gap:8px}
.cal-title{min-width:150px;text-align:center}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal-dow{text-align:center;font-size:.75rem;color:var(--muted);padding:2px 0 4px;text-transform:capitalize}
.cal-day{min-height:84px;border:1px solid var(--line);border-radius:14px;padding:8px;display:flex;flex-direction:column;gap:5px;text-align:left;transition:.2s;background:rgba(255,255,255,.015);min-width:0}
.cal-day:hover{border-color:var(--accent-2);background:rgba(198,255,61,.05)}
.cal-day.out{opacity:.3}
.cal-day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal-day.over{background:var(--red-bg)}
.cal-day.done{background:var(--green-bg)}
.cal-day .n{font-size:.85rem}
.cal-day .amt{font-size:.72rem;color:#cfc3cc;margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:3px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.dot.g{background:var(--green)}.dot.r{background:var(--red)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:14px}
.legend span{display:flex;align-items:center;gap:6px}
.modal-card.wide{max-width:600px}
.modal-card .item{padding:12px 6px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#0e0c0f;border:1px solid var(--line-2);border-radius:999px;padding:4px}
.seg button{padding:8px 6px;border-radius:999px;font-size:.88rem;color:var(--muted);transition:.2s}
.seg button.active{background:linear-gradient(90deg,#3f5c14,#1b2709);color:#fff}
.hint{font-size:.8rem;color:var(--muted);background:rgba(198,255,61,.06);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.loading{position:fixed;inset:0;display:grid;place-items:center;z-index:70;background:rgba(5,4,6,.55)}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.fixas .item{grid-template-columns:auto 1fr auto auto}
.fx-icon{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:rgba(198,255,61,.1);color:var(--accent)}
.fx-icon svg{width:16px;height:16px}

.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);margin-bottom:6px}
.back:hover{color:var(--accent)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,4,6,.7);backdrop-filter:blur(6px);display:grid;place-items:center;padding:16px;z-index:50}
.modal-card{width:100%;max-width:440px;padding:28px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 32px);overflow:auto}
.modal-card h3{font-weight:500;font-size:1.3rem}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.switch{display:flex;align-items:center;gap:10px;flex-direction:row;color:var(--text);cursor:pointer}
.switch input{width:20px;height:20px;accent-color:var(--green)}
.icon-pick{display:flex;gap:8px;flex-wrap:wrap}
.icon-pick button{width:42px;height:42px;border-radius:12px;border:1px solid var(--line-2);display:grid;place-items:center;color:var(--muted)}
.icon-pick button.active{border-color:var(--accent);color:var(--accent);background:rgba(198,255,61,.1)}

/* Campos personalizados (data, lista, número) */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.field-btn{display:flex;align-items:center;gap:10px;width:100%;background:#0e0c0f;border:1px solid var(--line-2);border-radius:14px;padding:11px 14px;color:var(--text);text-align:left;transition:.2s;min-height:46px}
.field-btn:hover{border-color:var(--accent-2)}
.field-btn.open,.field-btn:focus-visible{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(198,255,61,.12);outline:none}
.field-btn .fb-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.field-btn .fb-sub{color:var(--muted);font-size:.8rem}
.field-btn>svg{color:var(--accent);width:18px;height:18px}
.field-btn .chev{color:var(--muted);transition:.2s}
.field-btn.open .chev{transform:rotate(180deg)}
.money-wrap{position:relative}
.money-wrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:.9rem}
.money-wrap input{padding-left:42px;font-variant-numeric:tabular-nums}
.stepper{display:grid;grid-template-columns:44px 1fr 44px;background:#0e0c0f;border:1px solid var(--line-2);border-radius:14px;overflow:hidden;transition:.2s}
.stepper:focus-within{border-color:var(--accent-2);box-shadow:0 0 0 3px rgba(198,255,61,.12)}
.stepper input{border:0;border-radius:0;text-align:center;background:transparent;box-shadow:none!important;padding:11px 4px}
.stepper button{color:var(--accent);font-size:1.25rem;transition:.2s}
.stepper button:hover{background:rgba(198,255,61,.1)}
.pop{position:fixed;z-index:80;background:linear-gradient(160deg,rgba(255,255,255,.06),rgba(255,255,255,.015)),#151216;border:1px solid var(--line-2);border-radius:20px;box-shadow:0 24px 60px -12px rgba(0,0,0,.8),0 0 0 1px rgba(198,255,61,.06);padding:14px;animation:popIn .14s ease-out}
@keyframes popIn{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.dp{width:300px}
.dp-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:10px}
.dp-title{display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-weight:500;transition:.2s}
.dp-title:hover{background:rgba(255,255,255,.06)}
.dp-title svg{width:14px;height:14px;color:var(--muted)}
.dp-nav{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#d6ccd4;transition:.2s}
.dp-nav:hover{background:rgba(198,255,61,.12);color:var(--accent)}
.dp-nav svg{width:16px;height:16px}
.dp-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.dp-dow{text-align:center;font-size:.72rem;color:var(--muted);padding:4px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.dp-day{position:relative;height:38px;border-radius:12px;font-size:.9rem;display:grid;place-items:center;transition:.15s}
.dp-day:hover{background:rgba(198,255,61,.12)}
.dp-day.out{color:#5d535c}
.dp-day.today{box-shadow:inset 0 0 0 1px var(--accent);color:var(--accent)}
.dp-day.sel{background:linear-gradient(135deg,#d4ff5c,#8fd12b);color:#0b1204;box-shadow:0 6px 18px -6px rgba(198,255,61,.7)}
.dp-day i{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);width:4px;height:4px;border-radius:50%;background:var(--accent-2)}
.dp-day.sel i{background:#0b1204}
.dp-months{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dp-months button{padding:14px 4px;border-radius:12px;font-size:.9rem;transition:.15s}
.dp-months button:hover{background:rgba(198,255,61,.12)}
.dp-months button.sel{background:linear-gradient(135deg,#d4ff5c,#8fd12b);color:#0b1204}
.dp-months button.cur{box-shadow:inset 0 0 0 1px var(--accent)}
.dp-foot{display:flex;gap:6px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap}
.dp-foot .pill{padding:6px 12px;font-size:.8rem}
.sel-list{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow:auto;min-width:220px}
.sel-opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;text-align:left;transition:.15s}
.sel-opt:hover,.sel-opt.kb{background:rgba(198,255,61,.1)}
.sel-opt.sel{color:var(--accent)}
.sel-opt .ok{margin-left:auto;opacity:0}
.sel-opt.sel .ok{opacity:1}
.sel-opt .oi{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:rgba(198,255,61,.1);color:var(--accent)}
.sel-opt .oi svg,.sel-opt .ok svg{width:16px;height:16px}
.nav-item .count:empty{display:none}
@media (max-width:560px){
  .pop.sheet{left:8px!important;right:8px;top:auto!important;bottom:8px;width:auto!important;border-radius:24px;padding:18px}
  .pop.sheet .dp{width:auto}
  .pop.sheet .dp-day{height:44px}
}

.toast{position:fixed;bottom:24px;max-width:calc(100% - 32px);left:50%;transform:translateX(-50%);background:#1d181e;border:1px solid var(--line-2);padding:12px 20px;border-radius:999px;z-index:60;font-size:.9rem}

/* Responsivo */
@media (max-width:1000px){.stats{grid-template-columns:1fr 1fr}.stats .stat:first-child{grid-column:1/-1}}
/* Próximos vencimentos */
.upcoming .item-sub .when{color:var(--accent)}
.upcoming .item-sub .when.late{color:var(--red)}
/* Gaveta de ações da despesa (celular) */
.sheet-amount{font-size:2rem;font-weight:500;margin:2px 0 4px}
.sheet-info{display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:.92rem;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.sheet-info dt{color:var(--muted)}
.sheet-info dd{text-align:right}
.sheet-actions{display:flex;flex-direction:column;gap:8px}
.sheet-actions .btn{width:100%;padding:14px 20px}

@media (max-width:760px){
  input,select,textarea{font-size:16px}

<body>
<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><linearGradient id="lgG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e6ff8a"/><stop offset="1" stop-color="#7bd11f"/></linearGradient></defs></svg>

<!-- LOGIN -->
<section id="login" class="login hidden">

    <div class="login-logo"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#10170b"/><rect x=".5" y=".5" width="63" height="63" rx="17.5" fill="none" stroke="#c6ff3d" stroke-opacity=".25"/><path d="M19 15h12.5a17 17 0 0 1 0 34H19z" fill="none" stroke="url(#lgG)" stroke-width="6" stroke-linejoin="round"/><path d="m25.5 32.5 5 5 9-10.5" fill="none" stroke="url(#lgG)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Minhas Despesas</span></div>

</section>

<!-- APP -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#10170b"/><rect x=".5" y=".5" width="63" height="63" rx="17.5" fill="none" stroke="#c6ff3d" stroke-opacity=".25"/><path d="M19 15h12.5a17 17 0 0 1 0 34H19z" fill="none" stroke="url(#lgG)" stroke-width="6" stroke-linejoin="round"/><path d="m25.5 32.5 5 5 9-10.5" fill="none" stroke="url(#lgG)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg> Despesas</div>
    <nav class="nav">
      <button class="nav-item" data-view="dashboard"><svg viewBox="0 0 24 24"><path d="M3 3h8v8H3zM13 3h8v5h-8zM13 10h8v11h-8zM3 13h8v8H3z"/></svg><span>Início</span></button>
      <button class="nav-item" data-view="debts"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>Dívidas</span><span class="count" id="countDebts"></span></button>
      <button class="nav-add" data-action="new-expense" aria-label="Nova despesa"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="nav-item" data-view="paid"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/></svg><span>Pagas</span><span class="count" id="countPaid"></span></button>
    </nav>
    <button class="nav-item logout" id="logoutBtn"><svg viewBox="0 0 24 24"><path d="M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11"/></svg><span>Sair</span></button>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="m-logo"><svg class="logo" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#10170b"/><rect x=".5" y=".5" width="63" height="63" rx="17.5" fill="none" stroke="#c6ff3d" stroke-opacity=".25"/><path d="M19 15h12.5a17 17 0 0 1 0 34H19z" fill="none" stroke="url(#lgG)" stroke-width="6" stroke-linejoin="round"/><path d="m25.5 32.5 5 5 9-10.5" fill="none" stroke="url(#lgG)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
      <div class="hello">
        <h1 class="welcome">Bem-vindo, <span class="accent" id="userName"></span></h1>
        <p class="muted subtitle">Aqui está o resumo das suas despesas</p>
      </div>
      <div class="topbar-right">
        <button class="btn btn-primary" data-action="new-expense">+ Nova despesa</button>
        <div class="user-chip"><div class="avatar" id="avatar"></div><div><span id="userName2"></span><small id="todayLabel"></small></div></div>
      </div>
    </header>
    <div id="view"></div>
  </main>
</div>

<div id="modal" class="modal hidden"><div class="modal-card glass" id="modalCard"></div></div>
<div id="toast" class="toast hidden"></div>

<div id="loading" class="loading hidden"><div class="spinner"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// ---------- Supabase ----------
const SUPABASE_URL = 'https://xraygbmishqxyrtiwyxy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhyYXlnYm1pc2hxeHlydGl3eXh5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MjU0NTUsImV4cCI6MjEwNTUwMTQ1NX0.MSznUZ4w8ZW8y4PTjbQmQiT8BEDhnA3enDs6quIk6OI';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
// login digitado (renan / jhennifer) vira o e-mail cadastrado no Supabase
const EMAIL_DOMAIN = '@despesas.app';

// ---------- Ícones dos blocos ----------
const ICONS = {
  home:   '<path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/>',
  card:   '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h3"/>',
  car:    '<path d="M5 16V11l2-5h10l2 5v5"/><path d="M3 16h18v3H3z"/><circle cx="7.5" cy="13" r=".5"/><circle cx="16.5" cy="13" r=".5"/>',
  cart:   '<circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/><path d="M2 3h3l3 12h11l2-8H6"/>',
  bolt:   '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>',
  heart:  '<path d="M12 20s-8-5-8-11a4.5 4.5 0 0 1 8-2.5A4.5 4.5 0 0 1 20 9c0 6-8 11-8 11z"/>',
  book:   '<path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4zM20 4h-6"/><path d="M20 4v14h-6"/>',
  wallet: '<path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 7l12-4v4M16 13h2"/>',
  phone:  '<rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/>',
  star:   '<path d="m12 3 2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'
};
const SVG = p => `<svg viewBox="0 0 24 24">${p}</svg>`;
const I = {
  check:'<path d="m5 12 5 5 9-10"/>',
  edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',
  back:'<path d="m15 18-6-6 6-6"/>',
  next:'<path d="m9 18 6-6-6-6"/>',
  dots:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',
  repeat:'<path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/>'
};

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const brl = v => (Number(v) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const todayISO = () => iso(new Date());
const fmtDate = s => s ? s.split('-').reverse().join('/') : '—';
const monthStart = s => s.slice(0, 7) + '-01';
// soma k meses a uma data mantendo o dia (limitado ao fim do mês)
function addMonths(s, k, day) {
  const [y, m, d] = s.split('-').map(Number);
  const first = new Date(y, m - 1 + k, 1);
  const last = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
  return iso(new Date(first.getFullYear(), first.getMonth(), Math.min(day || d, last)));
}
const isMobile = () => window.matchMedia('(max-width:760px)').matches;
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const cents = v => Math.round(Number(v) * 100);
const fmtMoney = v => (Number(v) || 0).toLocaleString('pt-BR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const parseMoney = s => Math.round(Number(String(s).replace(/\./g, '').replace(',', '.')) * 100) / 100 || 0;
const store = {
  get(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch { return def; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} }
};

// ---------- Estado ----------
let me = null;           // { id, nome }
let membros = {};        // user_id -> nome
let data = { blocos: [], fixas: [], despesas: [] };
let route = { view: 'dashboard', blockId: null, filter: 'all' };
let calMonth = monthStart(todayISO());

const blockById = id => data.blocos.find(b => b.id === id);
const fixaById = id => data.fixas.find(f => f.id === id);
const despById = id => data.despesas.find(e => e.id === id);
const expensesOf = id => data.despesas.filter(e => e.bloco_id === id);
const isOverdue = e => !e.pago && e.vencimento < todayISO();
const sum = arr => arr.reduce((t, e) => t + Number(e.valor || 0), 0);
const byDue = (a, b) => a.vencimento.localeCompare(b.vencimento) || (a.parcela_num || 0) - (b.parcela_num || 0);

// ---------- Acesso ao banco ----------
let busy = 0;
function loading(on) { busy += on ? 1 : -1; $('#loading').classList.toggle('hidden', busy <= 0); }
async function db(promise) {
  const { data: d, error } = await promise;
  if (error) throw error;
  return d;
}
// executa uma alteração, recarrega tudo e redesenha a tela
async function mutate(fn, okMsg) {
  loading(true);
  try { await fn(); await refresh(); closeModal(); render(); if (okMsg) toast(okMsg); }
  catch (err) { console.error(err); toast('Erro: ' + (err.message || 'não foi possível salvar')); }
  finally { loading(false); }
}
async function refresh() {
  await db(sb.rpc('desp_gerar_fixas'));
  const [blocos, fixas, despesas] = await Promise.all([
    db(sb.from('desp_blocos').select('*').order('criado_em')),
    db(sb.from('desp_fixas').select('*').order('nome')),
    db(sb.from('desp_despesas').select('*').order('vencimento'))
  ]);
  data = { blocos, fixas, despesas };
}

// ---------- Login ----------
function showLogin() {
  $('#app').classList.add('hidden');
  $('#login').classList.remove('hidden');
  $('#loginUser').focus();
}
async function startApp(user) {
  loading(true);
  try {
    const lista = await db(sb.from('desp_membros').select('user_id, nome'));
    membros = Object.fromEntries(lista.map(m => [m.user_id, m.nome]));
    if (!membros[user.id]) { await sb.auth.signOut(); showLogin(); toast('Usuário sem acesso a este app'); return; }
    me = { id: user.id, nome: membros[user.id] };
    await refresh();
  } catch (err) { console.error(err); toast('Erro ao carregar: ' + err.message); showLogin(); return; }
  finally { loading(false); }
  $('#userName').textContent = me.nome;
  $('#userName2').textContent = me.nome;
  $('#avatar').textContent = me.nome[0];
  $('#todayLabel').textContent = new Date().toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long' });
  $('#login').classList.add('hidden');
  $('#app').classList.remove('hidden');
  go('dashboard');
}
$('#loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const u = $('#loginUser').value.trim().toLowerCase();
  const btn = $('#loginForm button'); btn.disabled = true;
  loading(true);
  const { data: res, error } = await sb.auth.signInWithPassword({ email: u.includes('@') ? u : u + EMAIL_DOMAIN, password: $('#loginPass').value });
  loading(false); btn.disabled = false;
  if (error) { $('#loginError').classList.remove('hidden'); return; }
  $('#loginError').classList.add('hidden'); $('#loginPass').value = '';
  startApp(res.user);
});
$('#logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); me = null; showLogin(); });

// atualiza ao voltar para o app (ex.: a outra pessoa lançou algo)
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState !== 'visible' || !me || !$('#modal').classList.contains('hidden')) return;
  try { await refresh(); render(); } catch {}
});

// ---------- Navegação ----------
document.querySelectorAll('.nav-item[data-view]').forEach(b => b.addEventListener('click', () => go(b.dataset.view)));
document.querySelectorAll('[data-action="new-expense"]').forEach(b => b.addEventListener('click', () => expenseModal(null, { blockId: route.view === 'block' ? route.blockId : null })));

function go(view, blockId = null) {
  route = { view, blockId, filter: 'all' };
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function render() {
  document.querySelectorAll('.nav-item[data-view]').forEach(b =>
    b.classList.toggle('active', b.dataset.view === route.view || (route.view === 'block' && b.dataset.view === 'dashboard')));
  $('#countDebts').textContent = data.despesas.filter(e => !e.pago).length || '';
  $('#countPaid').textContent = data.despesas.filter(e => e.pago).length || '';
  const v = $('#view');
  if (route.view === 'block' && !blockById(route.blockId)) route.view = 'dashboard';
  if (route.view === 'dashboard') v.innerHTML = viewDashboard();
  else if (route.view === 'block') v.innerHTML = viewBlock();
  else if (route.view === 'debts') v.innerHTML = viewDebts();
  else if (route.view === 'paid') v.innerHTML = viewPaid();
  bindView(v);
}

// ---------- Views ----------
const plural = (n, s, p) => `${n} ${n === 1 ? s : p}`;

function viewDashboard() {
  const pend = data.despesas.filter(e => !e.pago);
  const over = pend.filter(isOverdue);
  const month = todayISO().slice(0, 7);
  const paidMonth = data.despesas.filter(e => e.pago && (e.data_pagamento || '').startsWith(month));

  const blocks = data.blocos.map(b => {
    const ex = expensesOf(b.id);
    const total = sum(ex), pago = sum(ex.filter(e => e.pago));
    const pct = total ? Math.round(pago / total * 100) : 0;
    const nPend = ex.filter(e => !e.pago).length;
    return `<div class="block" data-open-block="${b.id}" role="button" tabindex="0">
      <div class="block-top">
        <div class="block-icon">${SVG(ICONS[b.icone] || ICONS.wallet)}</div>
        <button class="icon-btn" data-edit-block="${b.id}" aria-label="Editar bloco" style="width:34px;height:34px">${SVG(I.dots)}</button>
      </div>
      <div><div class="block-name">${esc(b.nome)}</div><div class="muted" style="font-size:.8rem">Em aberto</div></div>
      <div class="block-amount">${brl(total - pago)}</div>
      <div class="progress"><i style="width:${pct}%"></i></div>
      <div class="block-meta"><span>${plural(nPend, 'pendente', 'pendentes')}</span><span>${pct}% pago</span></div>
    </div>`;
  }).join('');

  return `
  <div class="grid stats">
    <div class="glass stat glow"><div class="label">Total em aberto</div><div class="value">${brl(sum(pend))}</div><div class="sub">${plural(pend.length, 'dívida pendente', 'dívidas pendentes')}</div></div>
    <div class="glass stat"><div class="label">Pago este mês</div><div class="value" style="color:var(--green)">${brl(sum(paidMonth))}</div><div class="sub">${plural(paidMonth.length, 'pagamento', 'pagamentos')}</div></div>
    <div class="glass stat"><div class="label">Vencidas</div><div class="value" style="color:${over.length ? 'var(--red)' : 'var(--text)'}">${brl(sum(over))}</div><div class="sub">${over.length} em atraso</div></div>
  </div>

  ${upcoming()}

  <section class="glass panel" style="margin-top:16px">
    <div class="section-head"><h2>Meus blocos</h2><button class="btn btn-sm" data-new-block>+ Novo bloco</button></div>
    <div class="grid blocks">
      ${blocks}
      <button class="block block-new" data-new-block><span class="plus">+</span><span>Criar bloco</span></button>
    </div>
  </section>

  <section class="glass panel" style="margin-top:16px">${calendar()}</section>`;
}

function upcoming() {
  const t = todayISO();
  const prox = data.despesas.filter(e => !e.pago).sort(byDue).slice(0, 5);
  if (!prox.length) return '';
  const quando = e => {
    const dias = Math.round((new Date(e.vencimento + 'T12:00') - new Date(t + 'T12:00')) / 864e5);
    if (dias < 0) return `<span class="when late">Venceu há ${-dias} dia${dias === -1 ? '' : 's'}</span>`;
    if (dias === 0) return '<span class="when">Vence hoje</span>';
    if (dias === 1) return '<span class="when">Vence amanhã</span>';
    return `<span>Em ${dias} dias · ${fmtDate(e.vencimento).slice(0, 5)}</span>`;
  };
  return `<section class="glass panel upcoming" style="margin-top:16px">
    <div class="section-head"><h2>Próximos vencimentos</h2><button class="btn btn-sm" data-go="debts">Ver todas</button></div>
    <div class="list">${prox.map(e => {
      const b = blockById(e.bloco_id);
      return `<div class="item" data-item="${e.id}">
        <button class="check" data-toggle="${e.id}" aria-label="Marcar como pago"></button>
        <div><div class="item-name">${esc(e.nome)}</div><div class="item-sub">${quando(e)}${b ? `<span class="tag">${esc(b.nome)}</span>` : ''}${typeTag(e)}</div></div>
        <div class="item-amount">${brl(e.valor)}</div>
        <div class="item-actions"><button class="btn btn-green btn-sm" data-pay="${e.id}">Já paguei</button></div>
      </div>`;
    }).join('')}</div>
  </section>`;
}

function calendar() {
  const [y, m] = calMonth.split('-').map(Number);
  const first = new Date(y, m - 1, 1);
  const start = new Date(y, m - 1, 1 - first.getDay());   // domingo antes do dia 1
  const title = cap(first.toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
  const today = todayISO();
  const byDay = {};
  data.despesas.forEach(e => (byDay[e.vencimento] = byDay[e.vencimento] || []).push(e));
  const monthItems = data.despesas.filter(e => e.vencimento.startsWith(calMonth.slice(0, 7)));
  const cells = [];
  for (let i = 0; i < 42; i++) {
    const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m - 1) break;
    const key = iso(d), items = byDay[key] || [];
    const pend = items.filter(e => !e.pago);
    const cls = ['cal-day', d.getMonth() !== m - 1 && 'out', key === today && 'today',
      pend.some(isOverdue) && 'over', items.length && !pend.length && 'done'].filter(Boolean).join(' ');
    const dots = items.slice(0, 6).map(e => `<i class="dot ${e.pago ? 'g' : isOverdue(e) ? 'r' : ''}"></i>`).join('');
    cells.push(`<button class="${cls}" data-day="${key}" aria-label="${fmtDate(key)}"><span class="n">${d.getDate()}</span><span class="dots">${dots}</span>${items.length ? `<span class="amt">${brl(sum(items))}</span>` : ''}</button>`);
  }
  const dows = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'].map(d => `<div class="cal-dow">${d}</div>`).join('');
  return `
    <div class="section-head"><h2>Calendário</h2>
      <div class="cal-nav">
        <button class="icon-btn" data-cal="-1" aria-label="Mês anterior">${SVG(I.back)}</button>
        <span class="cal-title">${title}</span>
        <button class="icon-btn" data-cal="1" aria-label="Próximo mês">${SVG(I.next)}</button>
        <button class="btn btn-sm" data-cal="0">Hoje</button>
      </div>
    </div>
    <p class="muted" style="margin:-8px 0 12px">No mês: ${brl(sum(monthItems))} · pago ${brl(sum(monthItems.filter(e => e.pago)))}</p>
    <div class="cal">${dows}${cells.join('')}</div>
    <div class="legend"><span><i class="dot"></i> A pagar</span><span><i class="dot g"></i> Pago</span><span><i class="dot r"></i> Vencido</span></div>`;
}

function filterPills() {

  <section class="glass panel" style="margin-top:16px">
    <div class="section-head"><h2>Despesas</h2>

function viewDebts() {

function viewPaid() {
  const allPaid = data.despesas.filter(e => e.pago);
  let ex = route.filter === 'all' ? allPaid : allPaid.filter(e => e.bloco_id === route.filter);
  ex = [...ex].sort((a, b) => (b.data_pagamento || '').localeCompare(a.data_pagamento || ''));

  ex.forEach(e => { const k = (e.data_pagamento || '0000-00').slice(0, 7); (groups[k] = groups[k] || []).push(e); });
  const body = ex.length ? Object.keys(groups).map(k => {
    const [y, m] = k.split('-');
    const label = k === '0000-00' ? 'Sem data' : cap(new Date(+y, +m - 1, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
    return `<div class="month-group"><div class="month-head"><span>${label}</span><span style="color:var(--green)">${brl(sum(groups[k]))}</span></div>${list(groups[k], true, true)}</div>`;

  const last = [...allPaid].sort((a, b) => (b.data_pagamento || '').localeCompare(a.data_pagamento || ''))[0];
  return `
  <div class="grid stats" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <div class="glass stat glow"><div class="label">Total já pago</div><div class="value" style="color:var(--green)">${brl(sum(allPaid))}</div><div class="sub">${plural(allPaid.length, 'pagamento', 'pagamentos')}</div></div>
    <div class="glass stat"><div class="label">Último pagamento</div><div class="value" style="font-size:1.5rem">${last ? esc(last.nome) : '—'}</div><div class="sub">${last ? fmtDate(last.data_pagamento) + ' · ' + brl(last.valor) : 'nenhum ainda'}</div></div>

function typeTag(e) {

// ---------- Eventos ----------
function bindView(root) {
  const on = (sel, fn) => root.querySelectorAll(sel).forEach(el => el.addEventListener('click', ev => fn(el, ev)));
  root.querySelectorAll('[data-open-block]').forEach(el => {
    el.addEventListener('click', () => go('block', el.dataset.openBlock));
    el.addEventListener('keydown', e => { if (e.key === 'Enter') go('block', el.dataset.openBlock); });
  });
  on('[data-edit-block]', (el, ev) => { ev.stopPropagation(); blockModal(el.dataset.editBlock); });
  on('[data-new-block]', () => blockModal(null));
  on('[data-go]', el => go(el.dataset.go));
  on('[data-filter]', el => { route.filter = el.dataset.filter; render(); });
  on('[data-add-in]', el => expenseModal(null, { blockId: el.dataset.addIn }));
  on('[data-pay]', el => payModal(el.dataset.pay));
  on('[data-toggle]', el => {
    const e = despById(el.dataset.toggle);
    if (e.pago) mutate(() => db(sb.from('desp_despesas').update({ pago: false, data_pagamento: null }).eq('id', e.id)), 'Marcada como pendente');
    else payModal(e.id);
  });
  on('[data-edit]', el => expenseModal(el.dataset.edit));
  on('[data-edit-fixa]', el => fixaModal(el.dataset.editFixa));
  on('[data-del]', el => deleteModal(el.dataset.del));
  on('[data-cal]', el => {
    const k = +el.dataset.cal;
    calMonth = k ? addMonths(calMonth, k, 1) : monthStart(todayISO());
    render();
  });
  on('[data-day]', el => dayModal(el.dataset.day));
  // no celular, tocar na despesa abre a gaveta de ações
  root.querySelectorAll('[data-item]').forEach(el => el.addEventListener('click', ev => {
    if (!isMobile() || ev.target.closest('button')) return;
    itemSheet(el.dataset.item);
  }));
}

// ---------- Campos personalizados ----------
// Troca os campos nativos (data, lista, número, dinheiro) por versões no estilo do app.
// O campo original continua no formulário (escondido) e guarda o valor.
const CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>';
const CAL_ICON = '<path d="M4 6h16v14H4z"/><path d="M4 10h16M8 3v4M16 3v4"/>';
let popEl = null, popAnchor = null;

function closePop() {
  if (!popEl) return;
  popEl.remove(); popEl = null;
  if (popAnchor) { popAnchor.classList.remove('open'); popAnchor = null; }
}
function openPop(anchor, build) {
  const same = popAnchor === anchor;
  closePop();
  if (same) return;
  popEl = document.createElement('div');
  popEl.className = 'pop';
  document.body.appendChild(popEl);
  popAnchor = anchor; anchor.classList.add('open');
  build(popEl);
  placePop();
}
function placePop() {
  if (!popEl || !popAnchor) return;
  const sheet = window.innerWidth <= 560;
  popEl.classList.toggle('sheet', sheet);
  if (sheet) return;
  const r = popAnchor.getBoundingClientRect(), w = popEl.offsetWidth, h = popEl.offsetHeight;
  let top = r.bottom + 8;
  if (top + h > window.innerHeight - 8 && r.top - h - 8 > 8) top = r.top - h - 8;
  const left = Math.min(Math.max(8, r.left), window.innerWidth - w - 8);
  popEl.style.top = Math.max(8, top) + 'px'; popEl.style.left = left + 'px';
  if (popEl.querySelector('.sel-list')) popEl.style.minWidth = r.width + 'px';
}
document.addEventListener('mousedown', e => { if (popEl && !popEl.contains(e.target) && !popAnchor.contains(e.target)) closePop(); });
window.addEventListener('resize', closePop);
document.addEventListener('scroll', e => { if (popEl && !popEl.contains(e.target)) closePop(); }, true);

function fire(el) { el.dispatchEvent(new Event('input', { bubbles: true })); el.dispatchEvent(new Event('change', { bubbles: true })); }

function enhance(root) {
  root.querySelectorAll('input[type=date]').forEach(datePicker);
  root.querySelectorAll('select').forEach(customSelect);
  root.querySelectorAll('input.money').forEach(moneyInput);
  root.querySelectorAll('input[data-stepper]').forEach(stepper);
}

function datePicker(input) {
  input.classList.add('hidden');
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'field-btn';
  input.before(btn);
  const show = () => {
    const v = input.value;
    const wd = v ? new Date(v + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '') : '';
    btn.innerHTML = `${SVG(CAL_ICON)}<span class="fb-text">${v ? fmtDate(v) : 'Escolher data'} <span class="fb-sub">${wd}</span></span>${CHEV}`;
  };
  show();
  const pick = v => { input.value = v; show(); fire(input); closePop(); };
  btn.addEventListener('click', () => openPop(btn, pop => {
    const base = input.value || todayISO();
    const st = { y: +base.slice(0, 4), m: +base.slice(5, 7) - 1, view: 'days' };
    const draw = () => {
      const title = cap(new Date(st.y, st.m, 1).toLocaleDateString('pt-BR', { month: 'long', year: 'numeric' }));
      if (st.view === 'months') {
        const months = Array.from({ length: 12 }, (_, i) => {
          const nm = cap(new Date(2000, i, 1).toLocaleDateString('pt-BR', { month: 'short' }).replace('.', ''));
          const isSel = input.value && +input.value.slice(0, 4) === st.y && +input.value.slice(5, 7) - 1 === i;
          const isCur = todayISO().slice(0, 7) === `${st.y}-${String(i + 1).padStart(2, '0')}`;
          return `<button type="button" data-mo="${i}" class="${isSel ? 'sel' : ''} ${isCur ? 'cur' : ''}">${nm}</button>`;
        }).join('');
        pop.innerHTML = `<div class="dp">
          <div class="dp-head"><button type="button" class="dp-nav" data-y="-1">${SVG(I.back)}</button>
          <button type="button" class="dp-title" data-view="days">${st.y}</button>
          <button type="button" class="dp-nav" data-y="1">${SVG(I.next)}</button></div>
          <div class="dp-months">${months}</div></div>`;
      } else {
        const first = new Date(st.y, st.m, 1);
        const start = new Date(st.y, st.m, 1 - first.getDay());
        const has = new Set(data.despesas.map(e => e.vencimento));
        let cells = '';
        for (let i = 0; i < 42; i++) {
          const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i), k = iso(d);
          const cls = ['dp-day', d.getMonth() !== st.m && 'out', k === todayISO() && 'today', k === input.value && 'sel'].filter(Boolean).join(' ');
          cells += `<button type="button" class="${cls}" data-d="${k}">${d.getDate()}${has.has(k) ? '<i></i>' : ''}</button>`;
        }
        const t = todayISO();
        const tm = new Date(); tm.setDate(tm.getDate() + 1);
        const quick = [['Hoje', t], ['Amanhã', iso(tm)], ['+1 mês', addMonths(input.value || t, 1)]];
        pop.innerHTML = `<div class="dp">
          <div class="dp-head"><button type="button" class="dp-nav" data-m="-1" aria-label="Mês anterior">${SVG(I.back)}</button>
          <button type="button" class="dp-title" data-view="months">${title} ${CHEV}</button>
          <button type="button" class="dp-nav" data-m="1" aria-label="Próximo mês">${SVG(I.next)}</button></div>
          <div class="dp-grid">${['D', 'S', 'T', 'Q', 'Q', 'S', 'S'].map(d => `<div class="dp-dow">${d}</div>`).join('')}${cells}</div>
          <div class="dp-foot">${quick.map(([l, v]) => `<button type="button" class="pill" data-d="${v}">${l}</button>`).join('')}</div></div>`;
      }
      pop.querySelectorAll('[data-d]').forEach(b => b.addEventListener('click', () => pick(b.dataset.d)));
      pop.querySelectorAll('[data-m]').forEach(b => b.addEventListener('click', () => { const d = new Date(st.y, st.m + +b.dataset.m, 1); st.y = d.getFullYear(); st.m = d.getMonth(); draw(); }));
      pop.querySelectorAll('[data-y]').forEach(b => b.addEventListener('click', () => { st.y += +b.dataset.y; draw(); }));
      pop.querySelectorAll('[data-mo]').forEach(b => b.addEventListener('click', () => { st.m = +b.dataset.mo; st.view = 'days'; draw(); }));
      pop.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => { st.view = b.dataset.view; draw(); }));
      placePop();
    };
    draw();
  }));
}

function customSelect(select) {
  select.classList.add('hidden');
  const btn = document.createElement('button');
  btn.type = 'button'; btn.className = 'field-btn';
  select.before(btn);
  const icon = o => o && o.dataset.icon ? SVG(ICONS[o.dataset.icon] || ICONS.wallet) : '';
  const show = () => { const o = select.selectedOptions[0]; btn.innerHTML = `${icon(o)}<span class="fb-text">${o ? esc(o.textContent) : ''}</span>${CHEV}`; };
  show();
  btn.addEventListener('click', () => openPop(btn, pop => {
    pop.innerHTML = `<div class="sel-list">${[...select.options].map(o => `
      <button type="button" class="sel-opt ${o.value === select.value ? 'sel' : ''}" data-v="${esc(o.value)}">
        ${o.dataset.icon ? `<span class="oi">${icon(o)}</span>` : ''}<span>${esc(o.textContent)}</span><span class="ok">${SVG(I.check)}</span>
      </button>`).join('')}</div>`;
    pop.querySelectorAll('[data-v]').forEach(b => b.addEventListener('click', () => {
      select.value = b.dataset.v; show(); fire(select); closePop();
    }));
  }));
}

// digitação estilo caixa: só números, as duas últimas casas viram centavos
function moneyInput(input) {
  input.setAttribute('inputmode', 'numeric'); input.autocomplete = 'off';
  const wrap = document.createElement('div'); wrap.className = 'money-wrap';
  input.before(wrap); wrap.append(Object.assign(document.createElement('span'), { textContent: 'R$' }), input);
  input.addEventListener('input', () => {
    const digits = input.value.replace(/\D/g, '').replace(/^0+/, '').slice(0, 11);
    input.value = digits ? fmtMoney(Number(digits) / 100) : '';
  });
}

function stepper(input) {
  const wrap = document.createElement('div'); wrap.className = 'stepper';
  input.before(wrap);
  const mk = (t, d) => { const b = document.createElement('button'); b.type = 'button'; b.textContent = t; b.setAttribute('aria-label', d > 0 ? 'Aumentar' : 'Diminuir');
    b.addEventListener('click', () => {
      const min = +input.min, max = +input.max, v = (parseInt(input.value) || 0) + d;
      input.value = Math.min(max, Math.max(min, v)); fire(input);
    }); return b; };
  wrap.append(mk('−', -1), input, mk('+', 1));
}

// ---------- Modais ----------
function openModal(html, wide = false) {
  $('#modalCard').className = 'modal-card glass' + (wide ? ' wide' : '');
  closePop(); $('#toast').classList.add('hidden');
  $('#modalCard').innerHTML = html; $('#modal').classList.remove('hidden');
  enhance($('#modalCard'));
  const f = $('#modalCard input:not([type=checkbox]):not([type=date])'); if (f && !wide) setTimeout(() => f.focus(), 50);
}
function closeModal() { closePop(); $('#modal').classList.add('hidden'); $('#modalCard').innerHTML = ''; }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (popEl) closePop(); else closeModal(); } });
const bindClose = () => $('#modalCard').querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', closeModal));

function dayModal(day) {
  const items = data.despesas.filter(e => e.vencimento === day).sort((a, b) => (a.pago - b.pago) || a.nome.localeCompare(b.nome));
  const label = cap(new Date(day + 'T12:00').toLocaleDateString('pt-BR', { weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' }));
  openModal(`
    <h3>${label}</h3>
    ${items.length ? `<p class="muted">Total ${brl(sum(items))} · pago ${brl(sum(items.filter(e => e.pago)))} · a pagar ${brl(sum(items.filter(e => !e.pago)))}</p>` : ''}
    ${items.length ? list(items, true) : '<div class="empty" style="padding:24px">Nenhuma conta vence neste dia</div>'}
    <div class="modal-actions">
      <button class="btn" data-close>Fechar</button>
      <button class="btn btn-primary" id="dayAdd">+ Lançar neste dia</button>
    </div>`, true);
  bindClose();
  bindView($('#modalCard'));
  $('#dayAdd').addEventListener('click', () => expenseModal(null, { due: day }));
}

function blockModal(id) {
  const b = id ? blockById(id) : { nome: '', icone: 'wallet' };
  let icon = b.icone;
  openModal(`
    <h3>${id ? 'Editar bloco' : 'Novo bloco'}</h3>
    <form id="blockForm" style="display:flex;flex-direction:column;gap:14px">
      <label>Nome do bloco<input id="bName" value="${esc(b.nome)}" placeholder="Ex.: Cartão Nubank" required maxlength="40"></label>
      <label>Ícone</label>
      <div class="icon-pick" id="iconPick">${Object.keys(ICONS).map(k => `<button type="button" data-icon="${k}" class="${k === icon ? 'active' : ''}">${SVG(ICONS[k])}</button>`).join('')}</div>
      <div class="modal-actions">
        ${id ? `<button type="button" class="btn btn-danger" id="bDel" style="margin-right:auto">Excluir</button>` : ''}
        <button type="button" class="btn" data-close>Cancelar</button>
        <button class="btn btn-primary">Salvar</button>
      </div>
    </form>`);
  bindClose();
  $('#iconPick').querySelectorAll('button').forEach(bt => bt.addEventListener('click', () => {
    icon = bt.dataset.icon; $('#iconPick').querySelectorAll('button').forEach(x => x.classList.toggle('active', x === bt));
  }));
  $('#blockForm').addEventListener('submit', e => {
    e.preventDefault();
    const nome = $('#bName').value.trim(); if (!nome) return;
    mutate(() => id ? db(sb.from('desp_blocos').update({ nome, icone: icon }).eq('id', id))
                    : db(sb.from('desp_blocos').insert({ nome, icone: icon })), id ? 'Bloco atualizado' : 'Bloco criado');
  });
  if (id) $('#bDel').addEventListener('click', () => {
    const n = expensesOf(id).length + data.fixas.filter(f => f.bloco_id === id).length;
    confirmModal(`Excluir o bloco "${esc(b.nome)}"?`, n ? 'Todas as despesas e contas fixas dentro dele também serão excluídas.' : 'O bloco está vazio.', [
      { label: 'Excluir', run: () => mutate(() => db(sb.from('desp_blocos').delete().eq('id', id)), 'Bloco excluído') }
    ]);
  });
}

// Nova despesa: avulsa, fixa (todo mês) ou parcelada. Edição: altera só o lançamento escolhido.
function expenseModal(id, opts = {}) {
  if (!data.blocos.length) { toast('Crie um bloco primeiro'); blockModal(null); return; }
  const e = id ? despById(id) : {
    nome: '', valor: '', vencimento: opts.due || todayISO(), pago: false, data_pagamento: '',
    bloco_id: opts.blockId || data.blocos[0].id, tipo: 'avulsa'
  };
  let tipo = e.tipo;
  const blockSelect = `<label>Bloco<select id="eBlock">${data.blocos.map(b => `<option value="${b.id}" data-icon="${b.icone}" ${b.id === e.bloco_id ? 'selected' : ''}>${esc(b.nome)}</option>`).join('')}</select></label>`;
  openModal(`
    <h3>${id ? 'Editar despesa' : 'Nova despesa'}</h3>
    <form id="expForm" style="display:flex;flex-direction:column;gap:14px">
      ${id ? (e.tipo === 'parcelada' ? `<div class="hint">Parcela ${e.parcela_num} de ${e.parcela_total}</div>`
             : e.tipo === 'fixa' && fixaById(e.fixa_id) ? `<div class="hint">Lançamento de uma conta fixa. Para mudar todos os meses, <a href="#" id="goFixa" class="accent">edite a conta fixa</a>.</div>` : '')
           : `<div class="seg" id="tipoSeg">
                <button type="button" data-t="avulsa" class="active">Única</button>
                <button type="button" data-t="fixa">Fixa mensal</button>
                <button type="button" data-t="parcelada">Parcelada</button>
              </div>`}
      <label>Nome da dívida<input id="eName" value="${esc(e.nome)}" placeholder="Ex.: Conta de luz" required maxlength="60"></label>
      <div class="row">
        <label><span id="lblValor">Valor (R$)</span><input id="eAmount" class="money" value="${e.valor === '' ? '' : fmtMoney(e.valor)}" placeholder="0,00" required></label>
        <label><span id="lblDue">Vencimento</span><input id="eDue" type="date" value="${e.vencimento}"></label>
      </div>
      <div id="parcBox" class="hidden" style="display:flex;flex-direction:column;gap:14px">
        <div class="row">
          <label>Nº de parcelas<input id="eParc" type="number" min="2" max="120" step="1" value="2" data-stepper></label>
          <label>O valor digitado é<select id="eModo"><option value="parcela">Cada parcela</option><option value="total">Total da compra</option></select></label>
        </div>
        <label>Parcelas já pagas<input id="eJaPagas" type="number" min="0" max="119" step="1" value="0" data-stepper></label>
        <div class="hint" id="parcResumo"></div>
      </div>
      <div id="fixaBox" class="hint hidden">Vai ser lançada automaticamente todo mês no mesmo dia, a partir da data escolhida.</div>
      ${blockSelect}
      ${id && e.tipo === 'parcelada' ? `<label class="switch"><input type="checkbox" id="eAll"> Aplicar nome, valor e bloco às parcelas não pagas</label>` : ''}
      <div id="paidBox">
        <label class="switch"><input type="checkbox" id="ePaid" ${e.pago ? 'checked' : ''}> Já paguei</label>
        <label id="ePaidWrap" class="${e.pago ? '' : 'hidden'}" style="margin-top:12px">Data do pagamento<input id="ePaidDate" type="date" value="${e.data_pagamento || todayISO()}"></label>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancelar</button>
        <button class="btn btn-primary">Salvar</button>
      </div>
    </form>`);
  bindClose();
  const goFixa = $('#goFixa'); if (goFixa) goFixa.addEventListener('click', ev => { ev.preventDefault(); fixaModal(e.fixa_id); });

  const resumo = () => {
    const n = Math.max(2, parseInt($('#eParc').value) || 2);
    const v = parseMoney($('#eAmount').value);
    const parcela = $('#eModo').value === 'total' ? v / n : v;
    const ult = addMonths($('#eDue').value || todayISO(), n - 1);
    $('#parcResumo').textContent = `${n}x de ${brl(parcela)} = ${brl(parcela * n)} · última em ${fmtDate(ult)}`;
  };
  const setTipo = t => {
    tipo = t;
    document.querySelectorAll('#tipoSeg button').forEach(b => b.classList.toggle('active', b.dataset.t === t));
    $('#parcBox').classList.toggle('hidden', !!id || t !== 'parcelada');
    $('#fixaBox').classList.toggle('hidden', !!id || t !== 'fixa');
    $('#paidBox').classList.toggle('hidden', t !== 'avulsa' && !id);
    $('#lblValor').textContent = t === 'fixa' && !id ? 'Valor mensal (R$)' : 'Valor (R$)';
    $('#lblDue').textContent = t === 'avulsa' || id ? 'Vencimento' : t === 'fixa' ? 'Primeiro vencimento' : '1ª parcela vence';
    if (t === 'parcelada' && !id) resumo();
  };
  document.querySelectorAll('#tipoSeg button').forEach(b => b.addEventListener('click', () => setTipo(b.dataset.t)));
  ['#eParc', '#eModo', '#eAmount', '#eDue', '#eJaPagas'].forEach(s => $(s).addEventListener('input', () => tipo === 'parcelada' && !id && resumo()));
  $('#ePaid').addEventListener('change', ev => $('#ePaidWrap').classList.toggle('hidden', !ev.target.checked));
  setTipo(tipo);

  $('#expForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const nome = $('#eName').value.trim();
    const valor = parseMoney($('#eAmount').value);
    if (!nome) return toast('Digite o nome da dívida');
    if (!(valor > 0)) return toast('Digite o valor');
    const due = $('#eDue').value, bloco_id = $('#eBlock').value;
    const pago = $('#ePaid').checked, data_pagamento = pago ? ($('#ePaidDate').value || todayISO()) : null;

    if (id) {
      const applyAll = $('#eAll') && $('#eAll').checked;
      return mutate(async () => {
        await db(sb.from('desp_despesas').update({ nome, valor, vencimento: due, bloco_id, pago, data_pagamento }).eq('id', id));
        if (applyAll) await db(sb.from('desp_despesas').update({ nome, valor, bloco_id }).eq('grupo_id', e.grupo_id).eq('pago', false));
      }, 'Despesa atualizada');
    }
    if (tipo === 'avulsa') {
      return mutate(() => db(sb.from('desp_despesas').insert({ nome, valor, vencimento: due, bloco_id, pago, data_pagamento, tipo })), 'Despesa lançada');
    }
    if (tipo === 'fixa') {
      return mutate(() => db(sb.from('desp_fixas').insert({ nome, valor, bloco_id, dia_venc: +due.slice(8, 10), inicio: monthStart(due) })), 'Conta fixa criada');
    }
    // parcelada: divide o total em centavos (a diferença do arredondamento vai na 1ª parcela)
    const n = Math.min(120, Math.max(2, parseInt($('#eParc').value) || 2));
    const jaPagas = Math.min(n, Math.max(0, parseInt($('#eJaPagas').value) || 0));
    const total = $('#eModo').value === 'total' ? cents(valor) : cents(valor) * n;
    const base = Math.floor(total / n), resto = total - base * n;
    const grupo_id = crypto.randomUUID ? crypto.randomUUID() : ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c => (c ^ Math.random() * 16 >> c / 4).toString(16));
    const day = +due.slice(8, 10);
    const rows = Array.from({ length: n }, (_, i) => {
      const venc = addMonths(due, i, day);
      return { nome, bloco_id, tipo, grupo_id, parcela_num: i + 1, parcela_total: n,
        valor: (base + (i === 0 ? resto : 0)) / 100, vencimento: venc,
        pago: i < jaPagas, data_pagamento: i < jaPagas ? (venc < todayISO() ? venc : todayISO()) : null };
    });
    mutate(() => db(sb.from('desp_despesas').insert(rows)), `${n} parcelas lançadas`);
  });
}

function fixaModal(fid) {
  const f = fixaById(fid);
  const mesAtual = monthStart(todayISO());
  openModal(`
    <h3>Conta fixa</h3>
    <p class="muted">As mudanças valem para os lançamentos ainda não pagos deste mês em diante.</p>
    <form id="fixaForm" style="display:flex;flex-direction:column;gap:14px">
      <label>Nome<input id="fName" value="${esc(f.nome)}" required maxlength="60"></label>
      <div class="row">
        <label>Valor mensal (R$)<input id="fValor" class="money" value="${fmtMoney(f.valor)}" required></label>
        <label>Dia do vencimento<input id="fDia" type="number" min="1" max="31" step="1" value="${f.dia_venc}" data-stepper></label>
      </div>
      <label>Bloco<select id="fBlock">${data.blocos.map(b => `<option value="${b.id}" data-icon="${b.icone}" ${b.id === f.bloco_id ? 'selected' : ''}>${esc(b.nome)}</option>`).join('')}</select></label>
      ${f.fim ? `<div class="hint">Encerrada: último mês ${fmtDate(f.fim).slice(3)}</div>` : ''}
      <div class="modal-actions">
        ${f.fim ? `<button type="button" class="btn" id="fReativar" style="margin-right:auto">Reativar</button>`
                : `<button type="button" class="btn btn-danger" id="fEncerrar" style="margin-right:auto">Encerrar</button>`}
        <button type="button" class="btn" data-close>Cancelar</button>
        <button class="btn btn-primary">Salvar</button>
      </div>
    </form>`);
  bindClose();
  $('#fixaForm').addEventListener('submit', ev => {
    ev.preventDefault();
    const nome = $('#fName').value.trim(), valor = parseMoney($('#fValor').value);
    const dia_venc = Math.min(31, Math.max(1, parseInt($('#fDia').value) || 1)), bloco_id = $('#fBlock').value;
    mutate(async () => {
      await db(sb.from('desp_fixas').update({ nome, valor, dia_venc, bloco_id }).eq('id', fid));
      const futuros = data.despesas.filter(e => e.fixa_id === fid && !e.pago && e.mes_ref >= mesAtual);
      await Promise.all(futuros.map(e => db(sb.from('desp_despesas')
        .update({ nome, valor, bloco_id, vencimento: addMonths(e.mes_ref, 0, dia_venc) }).eq('id', e.id))));
    }, 'Conta fixa atualizada');
  });
  const enc = $('#fEncerrar');
  if (enc) enc.addEventListener('click', () => confirmModal(`Encerrar "${esc(f.nome)}"?`,
    'Ela para de ser lançada nos próximos meses. O que já foi lançado continua no histórico.', [
      { label: 'Encerrar', run: () => mutate(() => db(sb.from('desp_fixas').update({ fim: mesAtual }).eq('id', fid)), 'Conta fixa encerrada') },
      { label: 'Excluir de vez', run: () => mutate(async () => {
          await db(sb.from('desp_despesas').delete().eq('fixa_id', fid).eq('pago', false));
          await db(sb.from('desp_fixas').delete().eq('id', fid));
        }, 'Conta fixa excluída') }
    ]));
  const re = $('#fReativar');
  if (re) re.addEventListener('click', () => mutate(() => db(sb.from('desp_fixas').update({ fim: null }).eq('id', fid)), 'Conta fixa reativada'));
}

function itemSheet(id) {
  const e = despById(id), b = blockById(e.bloco_id), who = membros[e.criado_por];
  const fixa = e.tipo === 'fixa' && fixaById(e.fixa_id);
  const status = e.pago ? `<span class="tag green">Pago em ${fmtDate(e.data_pagamento)}</span>`
    : isOverdue(e) ? '<span class="tag red">Vencida</span>' : '<span class="tag">A pagar</span>';
  openModal(`
    <h3>${esc(e.nome)}</h3>
    <div class="sheet-amount" style="color:${e.pago ? 'var(--green)' : 'var(--text)'}">${brl(e.valor)}</div>
    <dl class="sheet-info">
      <dt>Situação</dt><dd>${status}</dd>
      <dt>Vencimento</dt><dd>${fmtDate(e.vencimento)}</dd>
      ${b ? `<dt>Bloco</dt><dd>${esc(b.nome)}</dd>` : ''}
      <dt>Tipo</dt><dd>${e.tipo === 'parcelada' ? `Parcela ${e.parcela_num} de ${e.parcela_total}` : e.tipo === 'fixa' ? 'Fixa mensal' : 'Única'}</dd>
      ${who ? `<dt>Lançada por</dt><dd>${esc(who)}</dd>` : ''}
    </dl>
    <div class="sheet-actions">
      ${e.pago ? '<button class="btn" id="sUnpay">Desmarcar pagamento</button>' : `<button class="btn btn-green" id="sPay">${SVG(I.check)} Já paguei</button>`}
      <button class="btn" id="sEdit">${SVG(I.edit)} Editar</button>
      ${fixa ? `<button class="btn" id="sFixa">${SVG(I.repeat)} Editar conta fixa</button>` : ''}
      <button class="btn btn-danger" id="sDel">${SVG(I.trash)} Excluir</button>
    </div>`);
  const on = (sel, fn) => { const el = $(sel); if (el) el.addEventListener('click', fn); };
  on('#sPay', () => payModal(id));
  on('#sUnpay', () => mutate(() => db(sb.from('desp_despesas').update({ pago: false, data_pagamento: null }).eq('id', id)), 'Marcada como pendente'));
  on('#sEdit', () => expenseModal(id));
  on('#sFixa', () => fixaModal(e.fixa_id));
  on('#sDel', () => deleteModal(id));
}

function payModal(id) {
  const e = despById(id);
  openModal(`
    <h3>Marcar como pago</h3>
    <p class="muted">${esc(e.nome)} ${e.tipo === 'parcelada' ? `(${e.parcela_num}/${e.parcela_total})` : ''} · ${brl(e.valor)}</p>
    <form id="payForm" style="display:flex;flex-direction:column;gap:14px">
      <label>Data do pagamento<input id="pDate" type="date" value="${todayISO()}"></label>
      <div class="modal-actions">
        <button type="button" class="btn" data-close>Cancelar</button>
        <button class="btn btn-green">${SVG(I.check)} Já paguei</button>
      </div>
    </form>`);
  bindClose();
  $('#payForm').addEventListener('submit', ev => {
    ev.preventDefault();
    mutate(() => db(sb.from('desp_despesas').update({ pago: true, data_pagamento: $('#pDate').value || todayISO() }).eq('id', id)), 'Pagamento registrado ✓');
  });
}

function deleteModal(id) {
  const e = despById(id);
  const del = (q, msg) => ({ label: msg, run: () => mutate(() => db(q), 'Excluído') });
  const T = sb.from.bind(sb);
  let opts;
  if (e.tipo === 'parcelada') opts = [
    del(T('desp_despesas').delete().eq('id', id), 'Só esta parcela'),
    del(T('desp_despesas').delete().eq('grupo_id', e.grupo_id).eq('pago', false), 'Todas as não pagas'),
    del(T('desp_despesas').delete().eq('grupo_id', e.grupo_id), 'Todas as parcelas')
  ];
  else if (e.tipo === 'fixa' && fixaById(e.fixa_id) && !fixaById(e.fixa_id).fim) opts = [
    del(T('desp_despesas').delete().eq('id', id), 'Só este mês'),
    { label: 'Este mês e encerrar a conta fixa', run: () => mutate(async () => {
        await db(sb.from('desp_despesas').delete().eq('id', id));
        await db(sb.from('desp_fixas').update({ fim: addMonths(e.mes_ref, -1, 1) }).eq('id', e.fixa_id));
      }, 'Conta fixa encerrada') }
  ];
  else opts = [del(T('desp_despesas').delete().eq('id', id), 'Excluir')];
  confirmModal(`Excluir "${esc(e.nome)}"?`, 'Essa ação não pode ser desfeita.', opts);
}

function confirmModal(title, text, actions) {
  openModal(`<h3>${title}</h3><p class="muted">${text}</p>
    <div class="modal-actions confirm-actions">${actions.map((a, i) => `<button class="btn btn-danger" data-act="${i}">${a.label}</button>`).join('')}<button class="btn" data-close>Cancelar</button></div>`);
  bindClose();
  $('#modalCard').querySelectorAll('[data-act]').forEach(b => b.addEventListener('click', () => actions[+b.dataset.act].run()));
}

let toastT;
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 2600);
}

// ---------- Início ----------
sb.auth.getSession().then(({ data: { session } }) => session ? startApp(session.user) : showLogin());
